[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.cmake_extra_args = -DZ_FEATURE_LINK_SERIAL=0 -DZ_FEATURE_LINK_BLUETOOTH=0 -DZ_TRANSPORT_LEASE=10000 -DZ_TRANSPORT_LEASE_EXPIRE_FACTOR=2
build_flags =
    -DCP_ROS_DOMAIN_ID=0
    -DZENOH_ARDUINO_ESP32
    -DZENOH_COMPILER_GCC
    -DZENOH_C_STANDARD=99
    -Ilib/zenoh-pico/build/include
