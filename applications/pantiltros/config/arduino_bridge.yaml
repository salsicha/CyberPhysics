turret_arduino_bridge:
  ros__parameters:
    joint_command_topic: /turret/joint_commands
    joint_state_topic: /turret/joint_states
    diagnostics_topic: /turret/diagnostics
    emergency_stop_topic: /turret/emergency_stop
    actuator_ready_topic: /turret/actuator_ready
    # The link (transport serial, uno_q_bridge or sts) and its port or socket
    # come from config/arduino.env, config/arduino_uno_q.env or
    # config/jetson_uart.env, not from this file.
    # uno_q_bridge: an RPC unanswered for this long makes the MCU not ready.
    rpc_timeout_s: 0.5
    # uno_q_bridge: exit after the router socket has been unreachable this
    # long, so the container restarts on a recreated socket (0: keep retrying).
    router_lost_exit_s: 30.0
    # SET lines are written only after a false message on emergency_stop_topic.
    require_estop_release: true
    diagnostic_rate_hz: 1.0
    pan_min_rad: -1.5708
    pan_max_rad: 1.5708
    tilt_min_rad: -0.65
    tilt_max_rad: 0.75
    # sts (servos driven from this host, no Arduino): the settings of the
    # firmware's src/turret_config.h. Servo step = zero_steps + direction *
    # rad * 4096 / 2pi (the pan_tilt_ros convention: 2048 at 0 rad, steps
    # decreasing as the angle grows); IDs as pantiltros/config/ctrl_config.yaml.
    pan_servo_id: 12
    tilt_servo_id: 13
    pan_zero_steps: 2048
    tilt_zero_steps: 2048
    pan_direction: -1
    tilt_direction: -1
    servo_speed: 2000  # goal speed, steps/s (0: servo maximum)
    servo_acceleration: 50  # goal acceleration, 100 steps/s^2
    # Wait this long for a servo's status packet before reporting a timeout
    servo_reply_timeout_s: 0.01
    # STOP and the 500 ms watchdog hold pan/tilt's measured position (and
    # return the launcher's trigger to 0, its rack stopped); true: pan/tilt
    # torque off
    stop_disables_torque: false
    # The foam dart launcher (systems/racecar_turret/interfaces.md): fitted
    # or not comes from TURRET_ACTUATOR_FITTED in the env files, not from
    # this file. Every transport clamps commands to these limits
    # (hardware/parts/turret/_launcher.py): the priming rack in metres (0
    # forward, 0.038 back primes it; the sear catches from 0.03425), the
    # trigger in radians (0 safe, 0.6 lifts the sear 5.4 mm; 4.45 mm releases
    # it). sts: the servo settings of the firmware's turret_config.h: the
    # rack's pinion pitch radius is the design's (module 1.5, 18 teeth); the
    # torque limits (0.1 % units) are the rack's 55 % (priming needs about
    # 0.9-1.05 N m of 2.9) and the trigger's 30 % (it stalls against the
    # safety catch when that is on); the steps at 0 and the directions are
    # placeholders to set at bring-up (hardware/parts/turret/README.md).
    actuator_min_m: 0.0
    actuator_max_m: 0.038
    actuator_servo_id: 14
    actuator_zero_steps: 512
    actuator_direction: 1
    actuator_pinion_radius_m: 0.0135
    actuator_torque_limit: 550
    trigger_min_rad: 0.0
    trigger_max_rad: 0.6
    trigger_servo_id: 15
    trigger_zero_steps: 2048
    trigger_direction: 1
    trigger_torque_limit: 300
    # The sts watchdog and 25 Hz position feedback run on the poll_rate_hz
    # timer (default 50 Hz): keep it at 50 Hz or more with sts.
