# Simulator profile (compositions/turret_sim.yaml, pantiltros.yaml): prompts,
# initial selection and the very low confidence are tuned to the synthetic
# warehouse scene. The physical turret uses yolo_tracker_hardware.yaml.
pantilt_yolo_tracker:
  ros__parameters:
    camera_topic: /turret/camera/image_raw
    camera_info_topic: /turret/camera/camera_info
    joint_state_topic: /turret/joint_states
    joint_command_topic: /turret/joint_commands
    segments_topic: /turret/yolo/segments
    target_mask_topic: /turret/yolo/target_mask
    target_bbox_topic: /turret/yolo/target_bbox
    target_confidence_topic: /turret/yolo/target_confidence
    annotated_image_topic: /turret/yolo/annotated_image
    pixel_error_topic: /turret/target/pixel_error
    angular_error_topic: /turret/target/angular_error
    selected_id_topic: /turret/target/selected_id
    locked_topic: /turret/target/locked
    diagnostics_topic: /turret/diagnostics
    emergency_stop_topic: /turret/emergency_stop
    actuator_ready_topic: /turret/actuator_ready
    model_path: /workspace/cache/models/yoloe-26s-seg.pt
    device: "0"
    image_size: 640
    confidence: 0.003
    class_prompts:
      - blue utility cart
      - warehouse worker
      - red cardboard box
      - yellow quadcopter drone
      - green utility cart
    target_id: cart_blue_01
    target_class: blue utility cart
    initial_selection_normalized: [0.13, 0.565]
    association_gate_fraction: 0.50
    command_enabled: true
    require_estop_release: false
    kp: 0.4
    max_rate_rad_s: 1.5
    actuator_latency_s: 0.1
    joint_state_timeout_s: 0.5
    actuator_ready_timeout_s: 1.0
    pan_min_rad: -1.5708
    pan_max_rad: 1.5708
    tilt_min_rad: -0.65
    tilt_max_rad: 0.75
    # Fixed mount: no base rotation to compensate (the RACECAR Turret's
    # profiles are in systems/racecar_turret/config). Lead stays off here:
    # coasting through occlusions moved the aim onto a same-class decoy
    # inside the start-up association gate in turret_sim.
    base_compensation: false
    target_lead: false
    lock_tolerance_px: 36.0
    # Foam dart launcher: compositions/turret_sim.yaml fits the simulated one
    # (TURRET_ACTUATOR_FITTED); its operator script reloads and fires.
    actuator_fitted: false
    launcher_stroke_m: 0.038
    trigger_fire_rad: 0.6
    tag_dwell_s: 0.2
    tag_max_aim_error_deg: 2.0
    tag_min_interval_s: 2.0
    tag_stroke_timeout_s: 3.0
    tag_lock_timeout_s: 0.5
    auto_next: true
    darts: 0
    person_aim_fraction: 0.6
    person_max_box_fraction: 0.6
    person_height_m: 1.7
    # Aim offset for the dart's drop (pitch up, deg, against the camera's
    # range in m; held at the ends), for a person, whose range comes from
    # its box height and person_height_m. From the design's drop table at
    # 25 m/s, level fire (2 m 3.4 cm, 4 m 15 cm, 6 m 36 cm, 8 m 70 cm below
    # the bore line, from the muzzle 0.098 m ahead of the camera) minus the
    # bore's 48 mm above the camera's axis: atan((drop - 0.048) / (range +
    # 0.035)) about the tilt axis. NOMINAL: fit it to chronograph and range
    # tests on the built launcher. Other classes get no offset.
    aim_offset_range_m: [2.098, 4.098, 6.098, 8.098]
    aim_offset_pitch_deg: [-0.38, 1.41, 2.91, 4.58]
    # No no-fire zone (no_fire_zones_rad): nothing of the standalone turret
    # is in the dart's path at any pan and tilt (the design's check).
    publish_annotated_image: true
    show_window: false
    window_name: PanTiltROS YOLO
    warmup: true
    ready_file: /tmp/pantilt_yolo_ready
