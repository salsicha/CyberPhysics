# Physical turret (compositions/turret_hardware.yaml). Conservative defaults:
# the simulator profile in yolo_tracker.yaml is tuned to its synthetic warehouse
# scene and must not drive real servos.
#
# Commands are sent only after an explicit emergency-stop release (a false
# std_msgs/Bool on /turret/emergency_stop, see hardware/turret.md) and only
# while the Arduino bridge reports /turret/actuator_ready or measured joint
# states arrive. Select the target class with class_prompts/target_class.
pantilt_yolo_tracker:
  ros__parameters:
    camera_topic: /camera/camera/color/image_raw
    camera_info_topic: /camera/camera/color/camera_info
    joint_state_topic: /turret/joint_states
    joint_command_topic: /turret/joint_commands
    segments_topic: /turret/yolo/segments
    target_mask_topic: /turret/yolo/target_mask
    target_bbox_topic: /turret/yolo/target_bbox
    target_confidence_topic: /turret/yolo/target_confidence
    annotated_image_topic: /turret/yolo/annotated_image
    pixel_error_topic: /turret/target/pixel_error
    angular_error_topic: /turret/target/angular_error
    selected_id_topic: /turret/target/selected_id
    locked_topic: /turret/target/locked
    diagnostics_topic: /turret/diagnostics
    emergency_stop_topic: /turret/emergency_stop
    actuator_ready_topic: /turret/actuator_ready
    model_path: /workspace/cache/models/yoloe-26s-seg.pt
    device: "0"
    image_size: 640
    # Ultralytics' default threshold; the simulator's 0.003 accepts noise.
    confidence: 0.25
    class_prompts:
      - person
    target_id: target
    target_class: person
    # Start with the detection nearest the image centre and only follow it
    # within 15% of the image size per frame.
    initial_selection_normalized: [0.5, 0.5]
    association_gate_fraction: 0.15
    command_enabled: true
    require_estop_release: true
    # Stable even without latency compensation for up to 4 frames of delay.
    kp: 0.3
    max_rate_rad_s: 1.0
    actuator_latency_s: 0.15
    joint_state_timeout_s: 0.5
    actuator_ready_timeout_s: 1.0
    pan_min_rad: -1.5708
    pan_max_rad: 1.5708
    tilt_min_rad: -0.65
    tilt_max_rad: 0.75
    lock_tolerance_px: 36.0
    publish_annotated_image: true
    show_window: false
    window_name: PanTiltROS YOLO
    warmup: true
    ready_file: /tmp/pantilt_yolo_ready
