world_name: grass
drones:
  - model_type: quadrotor_base
    model_name: aerodrone
    xyz: [0.0, 0.0, 0.3665]
    rpy: [0.0, 0.0, 0.0]
    enable_velocity_control: false
    payload:
      # No Gazebo GPS payload: /aerodrone/sensor_measurements/gps is ArduPilot's
      # GPS from MAVROS (one publisher, as on hardware).
      - model_type: hd_camera
        model_name: downward_rgb
        xyz: [0.14215, 0.0, -0.0798]
        rpy: [0.0, 1.57079632679, 0.0]
      - model_type: rgbd_camera
        model_name: downward_rgbd
        xyz: [0.14215, 0.0, -0.0798]
        rpy: [0.0, 1.57079632679, 0.0]
objects: []
