[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_microros_transport = ethernet
monitor_speed = 115200
; micro_ros_platformio at a fixed commit, built for ROS 2 Jazzy like the
; image and its micro-ROS agent (upstream main defaults to Kilted, whose
; ament_cmake_ros adds rmw_test_fixture, which fails in micro-ROS's dev build)
board_microros_distro = jazzy
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1