
[env]
framework = arduino
; micro_ros_platformio at a fixed commit, built for ROS 2 Jazzy like the
; image and its micro-ROS agent (upstream main defaults to Kilted, whose
; ament_cmake_ros adds rmw_test_fixture, which fails in micro-ROS's dev build)
board_microros_distro = jazzy
lib_deps = https://github.com/micro-ROS/micro_ros_platformio#cfee17faffaa532363b7151dd13af6a85c69d3c1

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.filesystem_size = 0.5m

; board_microros_transport = wifi
; build_flags =
;     -D MICROROS_AGENT_IP=192.168.1.100 # Replace with your agent's IP
;     -D MICROROS_AGENT_PORT=8888 # Default port