services:
  simstudio:
    image: salsicha/cyberphysics:simstudio-latest
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/simstudio
      - POSTGRES_URL=postgresql://postgres:postgres@db:5432/simstudio
      - BETTER_AUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      # Development defaults (Sim requires >= 32 characters); override for real use
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-dev-secret-at-least-32-characters-long}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-at-least-32-chars}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-dev-internal-api-secret-min-32-chars}
      # Ollama from the local-gpu / local-cpu profiles below (published on the host)
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - GOOGLE_CLIENT_ID=placeholder
      - GOOGLE_CLIENT_SECRET=placeholder
      - GITHUB_CLIENT_ID=placeholder
      - GITHUB_CLIENT_SECRET=placeholder
      - RESEND_API_KEY=placeholder
      - WEBCONTAINER_CLIENT_ID=placeholder
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  db:
    # Sim's migrations need the pgvector extension
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=simstudio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  local-llm-gpu:
    profiles: 
      - local-gpu # This profile requires both 'local' and 'gpu'
    image: ollama/ollama:latest
    pull_policy: always
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      - OLLAMA_LOAD_TIMEOUT=-1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_DEBUG=1
    command: "serve"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 5

  local-llm-cpu:
    profiles:
      - local-cpu # This profile requires both 'local' and 'cpu'
    image: ollama/ollama:latest
    pull_policy: always
    volumes:
      - ${HOME}/.ollama:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_LOAD_TIMEOUT=-1
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_DEBUG=1
    command: "serve"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: