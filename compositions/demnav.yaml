# Standalone DemNav. Needs /navigation/origin (the ArduPilot EKF origin from
# applications/aerostack2/scripts/ardupilot_navigation_bridge.py) before it
# publishes local outputs.
services:
  demnav:
    env_file: [../systems/ros2/middleware.env]
    network_mode: "host"
    pull_policy: if_not_present
    image: salsicha/cyberphysics:demnav-latest
    container_name: demnav
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - INITIAL_LAT=${INITIAL_LAT:-0.0}
      - INITIAL_LON=${INITIAL_LON:-0.0}
    volumes:
      - /dev/shm:/dev/shm
      - /data/demnav_cache:/data/demnav_cache
    command: >
      stdbuf -o L
      ros2 launch demnav_pkg demnav.launch.py
        gps_topic:=${GPS_TOPIC:-/drone0/sensor_measurements/gps}
        odom_topic:=${ODOM_TOPIC:-/drone0/sensor_measurements/odom}
        depth_topic:=${DEPTH_TOPIC:-/oak1/relative_depth}
        camera_info_topic:=${CAMERA_INFO_TOPIC:-/oak1/camera_info}
        initial_lat:=${INITIAL_LAT:-0.0}
        initial_lon:=${INITIAL_LON:-0.0}
        area_km:=${AREA_KM:-10.0}
        search_radius_m:=${SEARCH_RADIUS_M:-200.0}
        fov_deg:=${FOV_DEG:-90.0}
        origin_topic:=${ORIGIN_TOPIC:-/navigation/origin}
        prior_fix_topic:=${PRIOR_FIX_TOPIC:-/navigation/fix}
        prior_timeout_s:=2.0
        search_radius_sigma_scale:=3.0
        max_search_radius_m:=${MAX_SEARCH_RADIUS_M:-600.0}
        camera_mount_yaw_deg:=${CAMERA_MOUNT_YAW_DEG:-0.0}
        gps_altitude_datum:=${GPS_ALTITUDE_DATUM:-ellipsoid}
        geoid_file:=/usr/share/GeographicLib/geoids/egm96-5.pgm
        "rangefinder_topic:=${RANGEFINDER_TOPIC:-''}"
        rangefinder_timeout_s:=0.5
