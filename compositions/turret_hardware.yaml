# Physical PanTiltROS turret.  Its YOLO/controller service is the same code
# used by turret_sim.yaml, with the conservative yolo_tracker_hardware.yaml
# profile; the peers here are a real ROS camera and Arduino.  Nothing moves
# until the emergency stop is released on /turret/emergency_stop and the
# Arduino firmware implements the bridge's serial protocol (hardware/turret.md).
# The PanTiltROS and RealSense images both build on the repository's ROS 2
# Jazzy base, so every node on this DDS graph runs the same distro.

x-pantiltros-image: &pantiltros-image
  image: salsicha/cyberphysics:pantiltros-${CYBERPHYSICS_TAG:-latest}
  pull_policy: build
  build:
    context: ../applications/pantiltros

# Docker on some hosts (the UNO Q's Debian 13 Docker 26, or any host
# whose containerd runs with LimitNOFILE=infinity) gives containers an
# open-file limit of about 2^30. LTTng-UST, which every ROS 2 Jazzy process
# loads, then allocates and zeroes a 128 MiB descriptor bitmap: about 130 MB
# of extra RAM per node. These are the usual systemd defaults.
x-ros-ulimits: &ros-ulimits
  nofile:
    soft: 1024
    hard: 524288

services:
  pantilt_yolo:
    <<: *pantiltros-image
    container_name: turret_pantilt_yolo
    ulimits: *ros-ulimits
    network_mode: host
    ipc: host
    gpus: all
    shm_size: 8gb
    working_dir: /workspace/cache/models
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - YOLO_CONFIG_DIR=/workspace/cache/ultralytics
      - TORCH_HOME=/workspace/cache/torch
      - PANTILT_MODEL_DIR=/workspace/cache/models
    volumes:
      - ../applications/pantiltros/config:/workspace/pantiltros/config:ro
      - ../cache/turret:/workspace/cache
      - /dev/shm:/dev/shm
    command: >
      python3 /scripts/pantilt_yolo_tracker.py
      --ros-args
      --params-file /workspace/pantiltros/config/yolo_tracker_hardware.yaml
      -p camera_topic:=${TURRET_CAMERA_TOPIC:-/camera/camera/color/image_raw}
      -p camera_info_topic:=${TURRET_CAMERA_INFO_TOPIC:-/camera/camera/color/camera_info}
      -p model_path:=${TURRET_YOLO_MODEL:-yoloe-26s-seg.pt}
      -p device:="'${TURRET_YOLO_DEVICE:-0}'"
      -p image_size:=${TURRET_YOLO_IMAGE_SIZE:-640}
      -p confidence:=${TURRET_YOLO_CONFIDENCE:-0.25}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/pantilt_yolo_ready"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 10m
    restart: unless-stopped

  turret_pantiltros:
    <<: *pantiltros-image
    container_name: turret_pantiltros
    ulimits: *ros-ulimits
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    env_file:
      - ../applications/pantiltros/config/arduino.env
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ../applications/pantiltros/config:/workspace/pantiltros/config:ro
    command: >
      python3 /scripts/turret_arduino_bridge.py
      --ros-args
      --params-file /workspace/pantiltros/config/arduino_bridge.yaml

  # Enable this profile if the turret uses the repository's RealSense camera:
  # docker compose -f compositions/turret_hardware.yaml --profile realsense up
  turret_realsense:
    profiles: ["realsense"]
    image: salsicha/cyberphysics:realsense-${CYBERPHYSICS_TAG:-latest}
    pull_policy: build
    build:
      context: ../applications/realsense
    container_name: turret_realsense
    ulimits: *ros-ulimits
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
    restart: unless-stopped

  turret_arduino:
    profiles: ["arduino"]
    image: salsicha/cyberphysics:arduino-${CYBERPHYSICS_TAG:-latest}
    pull_policy: build
    build:
      context: ../applications/arduino
    container_name: turret_arduino
    network_mode: host
    privileged: true
    restart: "no"
    env_file:
      - ../applications/pantiltros/config/arduino.env
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.XAuthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-/tmp/.Xauthority}:/tmp/.XAuthority:ro
      - /dev:/dev
      - /dev/shm:/dev/shm
    command: /opt/arduino-ide/arduino-ide --no-sandbox
