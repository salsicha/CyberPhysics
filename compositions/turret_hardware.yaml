# Physical PanTiltROS turret.  Its YOLO/controller service is the same code
# used by turret_sim.yaml, with the conservative yolo_tracker_hardware.yaml
# profile; the peers here are a real ROS camera and Arduino.  Nothing moves
# until the emergency stop is released on /turret/emergency_stop and the
# Arduino firmware implements the bridge's serial protocol (hardware/turret.md).
# The PanTiltROS, RealSense and NiceGUI images all build on the repository's
# ROS 2 Jazzy base, so every node on this DDS graph runs the same distro.
#
# The foam dart launcher (the priming rack on a third ST3215, ID 14, and the
# trigger servo, ID 15, on the tilt stage; systems/racecar_turret/
# interfaces.md, "Foam dart launcher") is fitted: TURRET_ACTUATOR_FITTED
# (default true, as in config/arduino.env) switches it for the bridge and the
# tracker together; the firmware's own switch is TURRET_ACTUATOR_FITTED in
# src/turret_config.h. turret_ui serves the operator page in its turret-only
# layout on port 8080 (TURRET_UI_PORT): camera, lock, aim, Arm/Disarm, Fire,
# which shoots one dart per tap and only at the locked target, and Reload.

x-pantiltros-image: &pantiltros-image
  image: salsicha/cyberphysics:pantiltros-${CYBERPHYSICS_TAG:-latest}
  pull_policy: build
  build:
    context: ../applications/pantiltros
    args:
      TAG: ${CYBERPHYSICS_TAG:-latest}

# Docker on some hosts (the UNO Q's Debian 13 Docker 26, or any host
# whose containerd runs with LimitNOFILE=infinity) gives containers an
# open-file limit of about 2^30. LTTng-UST, which every ROS 2 Jazzy process
# loads, then allocates and zeroes a 128 MiB descriptor bitmap: about 130 MB
# of extra RAM per node. These are the usual systemd defaults.
x-ros-ulimits: &ros-ulimits
  nofile:
    soft: 1024
    hard: 524288

services:
  pantilt_yolo:
    env_file: [../systems/ros2/middleware.env]
    <<: *pantiltros-image
    container_name: turret_pantilt_yolo
    ulimits: *ros-ulimits
    network_mode: host
    ipc: host
    gpus: all
    shm_size: 8gb
    working_dir: /workspace/cache/models
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
      - YOLO_CONFIG_DIR=/workspace/cache/ultralytics
      - TORCH_HOME=/workspace/cache/torch
      - PANTILT_MODEL_DIR=/workspace/cache/models
    volumes:
      - ../applications/pantiltros/config:/workspace/pantiltros/config:ro
      - ../cache/turret:/workspace/cache
      - /dev/shm:/dev/shm
    command: >
      python3 /scripts/pantilt_yolo_tracker.py
      --ros-args
      --params-file /workspace/pantiltros/config/yolo_tracker_hardware.yaml
      -p camera_topic:=${TURRET_CAMERA_TOPIC:-/camera/camera/color/image_raw}
      -p camera_info_topic:=${TURRET_CAMERA_INFO_TOPIC:-/camera/camera/color/camera_info}
      -p model_path:=${TURRET_YOLO_MODEL:-yoloe-26s-seg.pt}
      -p device:="'${TURRET_YOLO_DEVICE:-0}'"
      -p image_size:=${TURRET_YOLO_IMAGE_SIZE:-640}
      -p confidence:=${TURRET_YOLO_CONFIDENCE:-0.25}
      -p actuator_fitted:=${TURRET_ACTUATOR_FITTED:-true}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/pantilt_yolo_ready"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 10m
    restart: unless-stopped

  turret_pantiltros:
    <<: *pantiltros-image
    container_name: turret_pantiltros
    ulimits: *ros-ulimits
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    env_file:
      - ../systems/ros2/middleware.env
      - ../applications/pantiltros/config/arduino.env
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
      - TURRET_ACTUATOR_FITTED=${TURRET_ACTUATOR_FITTED:-true}
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ../applications/pantiltros/config:/workspace/pantiltros/config:ro
    command: >
      python3 /scripts/turret_arduino_bridge.py
      --ros-args
      --params-file /workspace/pantiltros/config/arduino_bridge.yaml

  # The operator page (applications/nicegui) in its turret-only layout, from
  # this checkout's scripts: http://<host>:8080. It shows the camera the
  # tracker uses (TURRET_CAMERA_TOPIC) with the tracker's boxes.
  turret_ui:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:nicegui-${CYBERPHYSICS_TAG:-latest}
    pull_policy: build
    build:
      context: ../applications/nicegui
      args:
        TAG: ${CYBERPHYSICS_TAG:-latest}
    container_name: turret_ui
    ulimits: *ros-ulimits
    network_mode: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
      - UI_CAR=0
      - UI_TURRET=1
      - UI_TURRET_CAMERA_TOPIC=${TURRET_CAMERA_TOPIC:-/camera/camera/color/image_raw}
      - UI_PORT=${TURRET_UI_PORT:-8080}
    volumes:
      - ../applications/nicegui/scripts:/workspace/scripts:ro
    command: python3 /workspace/scripts/main.py

  # Enable this profile if the turret uses the repository's RealSense camera:
  # docker compose -f compositions/turret_hardware.yaml --profile realsense up
  turret_realsense:
    env_file: [../systems/ros2/middleware.env]
    profiles: ["realsense"]
    image: salsicha/cyberphysics:realsense-${CYBERPHYSICS_TAG:-latest}
    pull_policy: build
    build:
      context: ../applications/realsense
      args:
        TAG: ${CYBERPHYSICS_TAG:-latest}
    container_name: turret_realsense
    ulimits: *ros-ulimits
    network_mode: host
    ipc: host
    privileged: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
    restart: unless-stopped

  turret_arduino:
    profiles: ["arduino"]
    image: salsicha/cyberphysics:arduino-${CYBERPHYSICS_TAG:-latest}
    pull_policy: build
    build:
      context: ../applications/arduino
    container_name: turret_arduino
    network_mode: host
    privileged: true
    restart: "no"
    env_file:
      - ../applications/pantiltros/config/arduino.env
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.XAuthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-/tmp/.Xauthority}:/tmp/.XAuthority:ro
      - /dev:/dev
      - /dev/shm:/dev/shm
    command: /opt/arduino-ide/arduino-ide --no-sandbox
