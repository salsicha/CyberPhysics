# Physical Space ROS lunar rover stack.
#
# The repository provides the Space ROS runtime, hardware topic contract, and
# simulation validation scenario. Vehicle-specific motor, camera, power, and
# safety drivers should be added here or launched on the host while preserving
# the topics in systems/lunar_rover/config/topics.yaml.

services:
  lunar_rover_spaceros:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:spaceros-${CYBERPHYSICS_TAG:-latest}
    container_name: lunar_rover_spaceros
    # Docker on some hosts (the UNO Q's Debian 13 Docker 26, or any host
    # whose containerd runs with LimitNOFILE=infinity) gives containers an
    # open-file limit of about 2^30. LTTng-UST, which every ROS 2 Jazzy process
    # loads, then allocates and zeroes a 128 MiB descriptor bitmap: about 130 MB
    # of extra RAM per node. These are the usual systemd defaults.
    ulimits:
      nofile:
        soft: 1024
        hard: 524288
    network_mode: host
    ipc: host
    restart: unless-stopped
    # PID 1 `sleep` ignores signals; tini forwards them so `down` is immediate
    init: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # External drivers must select the same middleware as this runtime
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_zenoh_cpp}
    volumes:
      - ../systems/lunar_rover/config:/workspace/config:ro
      - /dev/shm:/dev/shm
    command: >
      bash -lc
      "echo 'Space ROS lunar rover hardware runtime ready.
      Connect hardware drivers to the /lunar_rover topic contract.';
      exec sleep infinity"
