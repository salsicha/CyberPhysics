# FastDDS transport of every ROS container: shared memory sized for the
# camera frames, UDP with larger socket buffers (applications/aerostack2/README.md).
x-fastdds-profile: &fastdds-profile /workspace/systems/aerodrone/config/fastdds.xml
x-fastdds-mount: &fastdds-mount ../systems/aerodrone/config/fastdds.xml:/workspace/systems/aerodrone/config/fastdds.xml:ro

# Object tracking (systems/aerodrone/tracking.md), opt-in: `--profile tracking`
# (tracker, detector, rosbridge and the web page on port 8080) or
# `--profile tracking_truth` (the ground-truth detector in place of the
# detector); compositions/aerodrone_tracking.yaml (shared with the aircraft)
# and aerodrone_tracking_sim.yaml (simulators only).
include:
  - path: aerodrone_tracking.yaml
    env_file: &tracking-env
      - ../systems/aerodrone/config/topics.env
      - ../systems/aerodrone/config/tracking.env
      - ../applications/aerostack2/config/tracking_gazebo.env
  - path: aerodrone_tracking_sim.yaml
    env_file: *tracking-env

services:
  demnav_assets:
    image: salsicha/cyberphysics:demnav-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    env_file: [../systems/aerodrone/config/topics.env, ../applications/aerostack2/config/mount_tamalpais.env]
    volumes:
      - demnav_gazebo_cache:/data/demnav_cache
    command: >
      /venv/bin/python3 -m demnav_pkg.seed_cache
        --lat ${INITIAL_LAT:-37.9234} --lon ${INITIAL_LON:--122.5967}
        --area-km ${AREA_KM:-8.0} --resolution-m ${DEM_RESOLUTION_M:-10.0}
        --cache-dir /data/demnav_cache
    restart: "no"

  wildnav_assets:
    image: salsicha/cyberphysics:wildnav-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    env_file: [../systems/aerodrone/config/topics.env, ../applications/aerostack2/config/mount_tamalpais.env]
    environment:
      WILDNAV_TILE_URL: ${WILDNAV_TILE_URL:-https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
    volumes:
      - wildnav_gazebo_cache:/data/wildnav_cache
    command: >
      /venv/bin/python3 -m wildnav_pkg.seed_cache
        --lat ${INITIAL_LAT:-37.9234} --lon ${INITIAL_LON:--122.5967}
        --zoom ${WILDNAV_ZOOM:-17}
        --search-radius-m ${WILDNAV_SEARCH_RADIUS_M:-1100.0}
        --max-tiles ${WILDNAV_MAX_TILES:-169}
        --feature-backend ${WILDNAV_FEATURE_BACKEND:-SIFT}
        --tile-url-template ${WILDNAV_TILE_URL:-https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
        --cache-dir /data/wildnav_cache
    restart: "no"

  target_assets:
    # Tracking targets (cars, people; systems/aerodrone/tracking.md): the
    # pinned Gazebo Fuel models of applications/aerostack2/missions/
    # tracking_targets.json, downloaded once into the cache, their licence
    # and SHA-256 checked (applications/demnav/scripts/target_models.py).
    image: salsicha/cyberphysics:demnav-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    volumes:
      - ../applications/demnav/scripts:/workspace/applications/demnav/scripts:ro
      - ../applications/aerostack2/missions:/workspace/missions:ro
      - tracking_targets_gazebo_cache:/data/target_cache
    command: >
      /venv/bin/python3 /workspace/applications/demnav/scripts/target_models.py fetch
        --targets /workspace/missions/tracking_targets.json --cache-dir /data/target_cache
    restart: "no"

  terrain_assets:
    image: salsicha/cyberphysics:demnav-${CYBERPHYSICS_TAG:-latest}
    network_mode: none
    depends_on:
      demnav_assets: {condition: service_completed_successfully}
      wildnav_assets: {condition: service_completed_successfully}
      target_assets: {condition: service_completed_successfully}
    env_file: [../systems/aerodrone/config/topics.env, ../applications/aerostack2/config/mount_tamalpais.env]
    volumes:
      - ../applications/ardupilot_sitl/scripts:/workspace/applications/ardupilot_sitl/scripts:ro
      - ../applications/aerostack2/models:/workspace/applications/aerostack2/models:ro
      - ../applications/demnav/scripts:/workspace/applications/demnav/scripts:ro
      - ../applications/aerostack2/missions:/workspace/missions:ro
      - demnav_gazebo_cache:/data/demnav_cache:ro
      - wildnav_gazebo_cache:/data/wildnav_cache:ro
      - tracking_targets_gazebo_cache:/data/target_cache:ro
      - navsim_gazebo_assets:/data/navsim_assets
    command: >
      /venv/bin/python3 /workspace/applications/demnav/scripts/build_georeferenced_terrain.py
        --lat ${INITIAL_LAT:-37.9234} --lon ${INITIAL_LON:--122.5967}
        --origin-alt ${ORIGIN_ALT:-781.0} --area-km ${AREA_KM:-8.0}
        --resolution-m ${DEM_RESOLUTION_M:-10.0} --zoom ${WILDNAV_ZOOM:-17}
        --mission /workspace/missions/wilderness_missions.json
        --cruise-agl ${CRUISE_AGL_M:-250.0}
        --targets /workspace/missions/tracking_targets.json
    restart: "no"

  gazebo:
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    depends_on:
      terrain_assets: {condition: service_completed_successfully}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_GL_VERSION_OVERRIDE: "3.3"
      MESA_LOADER_DRIVER_OVERRIDE: swrast
      IGN_RENDERING_ENGINE: ogre
      EGL_PLATFORM: surfaceless
      GZ_SIM_RESOURCE_PATH: /data/navsim_assets:/data/navsim_assets/models:/workspace/applications/aerostack2/models
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - navsim_gazebo_assets:/data/navsim_assets:ro
      - ../applications/aerostack2/models:/workspace/applications/aerostack2/models:ro
      - ../applications/gazebo/config:/workspace/config:ro
      - ../applications/gazebo/scripts:/workspace/scripts:ro
      - ../applications/gazebo/models/rgbd_camera.sdf.jinja:/opt/ros/humble/share/as2_gazebo_assets/models/rgbd_camera/rgbd_camera.sdf.jinja:ro
      - ../applications/gazebo/models/hd_camera.sdf.jinja:/opt/ros/humble/share/as2_gazebo_assets/models/hd_camera/hd_camera.sdf.jinja:ro
      - ../applications/gazebo/models/quadrotor_ardupilot.sdf.jinja:/opt/ros/humble/share/as2_gazebo_assets/models/quadrotor_base/quadrotor_base.sdf.jinja:ro
    command: >
      ros2 launch as2_gazebo_assets launch_simulation.py use_sim_time:=true
        simulation_config_file:=/data/navsim_assets/world_gazebo.yaml headless:=true

  gazebo_bridges:
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    depends_on: [gazebo]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
      GZ_SIM_RESOURCE_PATH: /data/navsim_assets:/data/navsim_assets/models:/workspace/applications/aerostack2/models
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - navsim_gazebo_assets:/data/navsim_assets:ro
      - ../applications/gazebo/scripts/drone_bridges_isolated.py:/opt/ros/humble/share/as2_gazebo_assets/launch/drone_bridges.py:ro
    command: >
      ros2 launch as2_gazebo_assets drone_bridges.py namespace:=aerodrone
        simulation_config_file:=/data/navsim_assets/world_gazebo.yaml

  gazebo_targets:
    # Moves the tracking targets (cars, people; terrain_assets puts them in
    # the world) along their tracks with Gazebo's clock, through the world's
    # set_pose service, and publishes their ground truth on
    # /simulation/targets (applications/gazebo/scripts/gazebo_tracking_targets.py).
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on: [gazebo]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - navsim_gazebo_assets:/data/navsim_assets:ro
      - ../applications/gazebo/scripts:/workspace/scripts:ro
      - ../applications/demnav/scripts/tracking_targets.py:/workspace/applications/demnav/scripts/tracking_targets.py:ro
    command: python3 /workspace/scripts/gazebo_tracking_targets.py --world mount_tamalpais

  navigator_sitl:
    image: salsicha/cyberphysics:navigator-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    depends_on: [gazebo]
    env_file: [../systems/aerodrone/config/topics.env, ../applications/aerostack2/config/mount_tamalpais.env]
    environment:
      SIM_JSON_HOST: 127.0.0.1
      GPS_INPUT_CORRECTIONS: ${GPS_INPUT_CORRECTIONS:-true}
    volumes:
      - ../applications/ardupilot_sitl/scripts:/workspace/applications/ardupilot_sitl/scripts:ro
      - ../applications/aerostack2/models:/workspace/applications/aerostack2/models:ro
      - ../systems/aerodrone:/workspace/systems/aerodrone:ro
      - navsim_gazebo_assets:/data/navsim_assets:ro
    command: /workspace/applications/ardupilot_sitl/scripts/run_arducopter_sitl.sh

  gazebo_ardupilot_backend:
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    depends_on: [gazebo_bridges, navigator_sitl]
    env_file: [../systems/aerodrone/config/topics.env, ../applications/aerostack2/config/mount_tamalpais.env]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - navsim_gazebo_assets:/data/navsim_assets:ro
      - ../applications/ardupilot_sitl/scripts:/workspace/applications/ardupilot_sitl/scripts:ro
      - ../applications/aerostack2/models:/workspace/applications/aerostack2/models:ro
      - ../applications/gazebo/scripts:/workspace/scripts:ro
    command: python3 /workspace/scripts/gazebo_ardupilot_backend.py

  mavros:
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    depends_on: [navigator_sitl]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes: [*fastdds-mount]
    command: ros2 launch mavros apm.launch fcu_url:=tcp://127.0.0.1:5760

  navigation_bridge:
    # Relays the ArduPilot EKF origin to /navigation/origin (the anchor of
    # every local navigation output) and, by default (GPS_INPUT_CORRECTIONS,
    # false turns it off), sends accepted DemNav/WildNav fixes to ArduPilot
    # as GPS 2 once SITL reports arducopter_gps_input.params, which
    # navigator_sitl loads with the same flag (tools/gps_denied_sitl_test.md).
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on: [mavros]
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}", FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile}
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
    command: >
      python3 /workspace/applications/aerostack2/scripts/ardupilot_navigation_bridge.py
        --ros-args -p mavros_namespace:=/mavros
        -p gps_input_enabled:=${GPS_INPUT_CORRECTIONS:-true}

  demnav:
    image: salsicha/cyberphysics:demnav-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    depends_on: [gazebo_bridges, mavros]
    env_file: [../systems/aerodrone/config/topics.env, ../applications/aerostack2/config/mount_tamalpais.env]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - demnav_gazebo_cache:/data/demnav_cache:ro
    # attitude_sigma_deg keeps the default 1 here, unlike Isaac:
    # this EKF's tilt error (0.2-0.5 deg RMS on GPS, 0.7-0.9 deg GPS-denied)
    # and yaw error (1-2 deg) are larger, and its frames are ~0.2 s older than
    # their stamps. At 0.5, 31% of replayed fixes fell outside 2 sigma.
    command: >
      ros2 launch demnav_pkg demnav.launch.py
        gps_topic:=${GPS_TOPIC:-/aerodrone/sensor_measurements/gps}
        odom_topic:=${ODOM_TOPIC:-/aerodrone/sensor_measurements/odom}
        depth_topic:=${DEPTH_TOPIC:-/aerodrone/sensor_measurements/downward_rgbd/depth}
        camera_info_topic:=${CAMERA_INFO_TOPIC:-/aerodrone/sensor_measurements/downward_rgbd/depth/camera_info}
        initial_lat:=${INITIAL_LAT:-37.9234} initial_lon:=${INITIAL_LON:--122.5967}
        area_km:=${AREA_KM:-8.0}
        search_radius_m:=${SEARCH_RADIUS_M:-900.0}
        dem_resolution_m:=${DEM_RESOLUTION_M:-10.0} fov_deg:=${FOV_DEG:-69.0}
        min_correlation:=${MIN_CORRELATION:-0.35} cache_dir:=/data/demnav_cache
        origin_topic:=/navigation/origin prior_fix_topic:=/navigation/fix
        prior_timeout_s:=2.0 search_radius_sigma_scale:=3.0
        max_search_radius_m:=${MAX_SEARCH_RADIUS_M:-2700.0}
        camera_mount_yaw_deg:=0.0 depth_is_metric:=true
        gps_altitude_datum:=ellipsoid geoid_file:=/usr/share/GeographicLib/geoids/egm96-5.pgm
        rangefinder_topic:=${RANGEFINDER_TOPIC:-/aerodrone/rangefinder} rangefinder_timeout_s:=0.5

  wildnav:
    image: salsicha/cyberphysics:wildnav-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    depends_on: [gazebo_bridges, demnav]
    env_file: [../systems/aerodrone/config/topics.env, ../applications/aerostack2/config/mount_tamalpais.env]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
      WILDNAV_TILE_URL: ${WILDNAV_TILE_URL:-https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}}
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - wildnav_gazebo_cache:/data/wildnav_cache:ro
    # Fix covariance fitted to WildNav's errors here (1-4 m, none beyond 2
    # sigma): tiles that are the rendered ground itself (the default 3 m floor
    # is for real imagery).
    command: >
      ros2 launch wildnav_pkg wildnav.launch.py
        image_topic:=${WILDNAV_IMAGE_TOPIC:-/aerodrone/sensor_measurements/downward_rgb/image_raw}
        camera_info_topic:=${WILDNAV_CAMERA_INFO_TOPIC:-/aerodrone/sensor_measurements/downward_rgb/camera_info}
        prediction_odom_topic:=${RAW_ODOM_TOPIC:-/aerodrone/sensor_measurements/odom}
        raw_odom_topic:=${RAW_ODOM_TOPIC:-/aerodrone/sensor_measurements/odom}
        gps_topic:=${GPS_TOPIC:-/aerodrone/sensor_measurements/gps}
        navigation_output_topic:=${NAVIGATION_ODOM_TOPIC:-/navigation/odometry}
        initial_lat:=${INITIAL_LAT:-37.9234} initial_lon:=${INITIAL_LON:--122.5967}
        zoom:=${WILDNAV_ZOOM:-17}
        search_radius_m:=${WILDNAV_SEARCH_RADIUS_M:-1100.0}
        max_tiles:=${WILDNAV_MAX_TILES:-169} max_tile_downloads_per_cycle:=0
        match_rate_hz:=${WILDNAV_RATE_HZ:-0.2}
        feature_backend:=${WILDNAV_FEATURE_BACKEND:-SIFT}
        min_matches:=${WILDNAV_MIN_MATCHES:-16} min_inliers:=${WILDNAV_MIN_INLIERS:-10}
        min_inlier_ratio:=${WILDNAV_MIN_INLIER_RATIO:-0.25} cache_dir:=/data/wildnav_cache
        origin_topic:=/navigation/origin prior_fix_topic:=/navigation/fix
        prior_timeout_s:=2.0 search_radius_sigma_scale:=3.0
        max_search_radius_m:=${WILDNAV_MAX_SEARCH_RADIUS_M:-3300.0}
        camera_mount_yaw_deg:=0.0
        attitude_sigma_deg:=0.5 match_sigma_floor_m:=1.0

  aerostack2_autonomy:
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    depends_on: [mavros, wildnav]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes: [/dev/shm:/dev/shm, *fastdds-mount]
    # A GoTo succeeds within go_to_threshold (m, 3D) of its target in
    # ArduPilot's own frame. GPS-denied, ArduPilot held its targets up to
    # 2.1 m off (median 0.3 m), and as2's 0.2 m default stalled the mission
    # at one waypoint for most of the denial; the wilderness waypoints are
    # 42 m or more apart and accepted within 4-8 m
    # (tools/gps_denied_sim_test.md, "Mission progress and the GoTo
    # threshold").
    command: >
      ros2 launch as2_platform_blueos blueos_autonomy.launch.py
        namespace:=aerodrone mavros_namespace:=/mavros
        navigation_odom_topic:=/navigation/odometry takeoff_altitude:=35.0
        go_to_threshold:=3.0

  flight_ready:
    # Ready to fly: MAVROS has a GPS fix and local odometry, and every
    # Aerostack2 server the mission tree calls can be discovered; the tree
    # gives each action server only 1 s while it is being built
    # (applications/aerostack2/README.md, "Mission start").
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on:
      mavros: {condition: service_started}
      aerostack2_autonomy: {condition: service_started}
      terrain_assets: {condition: service_completed_successfully}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
      - navsim_gazebo_assets:/data/navsim_assets:ro
    command: >
      python3 /workspace/applications/aerostack2/scripts/wait_for_mavros_navigation.py
        --namespace /mavros --timeout 900 --settle-seconds 3
        --behavior-tree /data/navsim_assets/${AERODRONE_MISSION:-wilderness}_mission.xml
        --behavior-namespace /aerodrone
    restart: "no"

  wilderness_mission:
    # AERODRONE_MISSION=tracking flies the tracking scenario instead of the
    # wilderness mission: take off, hold 40 m above the moving targets and
    # hover until stopped (tracking_mission.xml; flight_ready reads the
    # same tree). run_behavior_tree.py starts the tree again only when it
    # aborted while being built, before its first tick: the new process can
    # take more than the tree's 1 s to discover a behaviour server. Stopping
    # the stack mid-mission logs "Failed to cancel action server for
    # GoToBehavior" although the goal is cancelled (README, "Mission start").
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # passed on to ros2 launch (which ignores SIGTERM)
    network_mode: host
    ipc: host
    depends_on:
      aerostack2_autonomy: {condition: service_started}
      flight_ready: {condition: service_completed_successfully}
      terrain_assets: {condition: service_completed_successfully}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
      - navsim_gazebo_assets:/data/navsim_assets:ro
    command: >
      python3 /workspace/applications/aerostack2/scripts/run_behavior_tree.py
        --attempts 5 --retry-delay 5 --
        ros2 launch as2_behavior_tree behavior_trees.launch.py
        drone_id:=aerodrone use_sim_time:=false
        tree:=/data/navsim_assets/${AERODRONE_MISSION:-wilderness}_mission.xml server_timeout:=120000

  navsim_validator:
    # Navigation health check, opt-in (exits 0 or lists what is missing,
    # stale or invalid; applications/aerostack2/README.md):
    #   docker compose -f compositions/aerostack2_sim.yaml --profile validation up
    # Raw MAVROS GPS/odometry/IMU, downward camera and depth, the latched
    # /navigation/origin, fused odometry/fix, DemNav/WildNav streams and the
    # Aerostack2 + MAVROS TF. DemNav matches once the mission has climbed
    # to CRUISE_AGL_M (NAVSIM_REQUIRE_VALID=demnav waits for it), which
    # takes many minutes in a simulator slower than real time, hence the
    # long timeout. No simulated rangefinder in this stack.
    # Gazebo's camera frame ids come from as2_gazebo_assets; only their
    # image/camera_info agreement is checked.
    profiles: ["validation"]
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on:
      flight_ready: {condition: service_completed_successfully}
    env_file: [../systems/aerodrone/config/topics.env, ../applications/aerostack2/config/mount_tamalpais.env]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
      NAVSIM_REQUIRE_VALID: ${NAVSIM_REQUIRE_VALID:-}
      NAVSIM_REQUIRE_CORRECTION: ${NAVSIM_REQUIRE_CORRECTION:-false}
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
    command: >
      python3 /workspace/applications/aerostack2/scripts/validate_aerodrone_navsim.py
        --timeout-s ${NAVSIM_VALIDATION_TIMEOUT_S:-1800}
        --freshness-s ${NAVSIM_VALIDATION_FRESHNESS_S:-10}
        --rangefinder-topic ""
        --required-tf earth:aerodrone/map aerodrone/map:aerodrone/odom
        aerodrone/odom:aerodrone/base_link map:map_ned base_link:base_link_frd
    restart: "no"

  # GPS-denied test, opt-in (tools/gps_denied_sim_test.sh gazebo runs it with
  # the validation profile and scores it; tools/gps_denied_sim_test.md):
  #   docker compose -f compositions/aerostack2_sim.yaml --profile denial up
  # The recorder writes ground truth, ArduPilot's position, the fused fix and
  # its covariance, the corrections and the DemNav/WildNav fixes to
  # GPS_DENIED_OUTPUT/recording.jsonl; the denier disables GPS 1 for a window
  # of simulation time during the cruise (denial_events.jsonl). Gazebo's
  # ground truth is the pose its bridge publishes (stamped in simulation
  # time), the frame ArduPilot's JSON backend flies.
  gps_denial_recorder:
    profiles: ["denial"]
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on: [mavros]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
      - ${GPS_DENIED_OUTPUT:-../generated/gps_denied_sim}:/out
    command: >
      python3 /workspace/applications/aerostack2/scripts/gps_denial_recorder.py
        --output /out/recording.jsonl --stack gazebo
        --truth-topic /aerodrone/ground_truth/pose --truth-type pose
        --origin-lat ${INITIAL_LAT:-37.9234} --origin-lon ${INITIAL_LON:--122.5967}
    restart: "no"

  gps_denier:
    # Once the mission reaches cruise (140 m above home) waits
    # GPS_DENIAL_START_S, sets SIM_GPS_DISABLE=1 for GPS_DENIAL_DURATION_S,
    # restores GPS 1 and exits GPS_DENIAL_RECOVERY_S later: all simulation
    # time (/clock), not wall time.
    profiles: ["denial"]
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on: [mavros]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      FASTRTPS_DEFAULT_PROFILES_FILE: *fastdds-profile
    volumes:
      - /dev/shm:/dev/shm
      - *fastdds-mount
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
      - ${GPS_DENIED_OUTPUT:-../generated/gps_denied_sim}:/out
    command: >
      python3 /workspace/applications/aerostack2/scripts/gps_denier.py
        --events /out/denial_events.jsonl --cruise-height-m 140.0
        --start-s ${GPS_DENIAL_START_S:-60.0} --duration-s ${GPS_DENIAL_DURATION_S:-150.0}
        --recovery-s ${GPS_DENIAL_RECOVERY_S:-60.0}
    restart: "no"

volumes:
  demnav_gazebo_cache:
  wildnav_gazebo_cache:
  navsim_gazebo_assets:
  tracking_targets_gazebo_cache:
