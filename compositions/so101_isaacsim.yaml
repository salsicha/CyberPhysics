services:
  isaacsim_cache_init:
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    user: "0:0"
    network_mode: none
    volumes:
      - ~/docker/isaac-sim/6.0.1/cache/kit:/isaac-sim/kit/cache:rw
      - ~/docker/isaac-sim/6.0.1/cache/user:/isaac-sim/.cache:rw
      - ~/docker/isaac-sim/6.0.1/cache/ov:/isaac-sim/.cache/ov:rw
      - ~/docker/isaac-sim/6.0.1/cache/pip:/isaac-sim/.cache/pip:rw
      - ~/docker/isaac-sim/6.0.1/cache/glcache:/isaac-sim/.cache/nvidia/GLCache:rw
      - ~/docker/isaac-sim/6.0.1/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
    entrypoint: ["/bin/chown"]
    command:
      - "1234:1234"
      - /isaac-sim/kit/cache
      - /isaac-sim/.cache
      - /isaac-sim/.cache/ov
      - /isaac-sim/.cache/pip
      - /isaac-sim/.cache/nvidia/GLCache
      - /isaac-sim/.nv/ComputeCache
    restart: "no"

  isaacsim:
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: so101_isaacsim
    depends_on:
      isaacsim_cache_init:
        condition: service_completed_successfully
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - ROS_DISTRO=jazzy
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - LD_LIBRARY_PATH=/isaac-sim/exts/isaacsim.ros2.core/jazzy/lib
    volumes:
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../systems:/workspace/systems:ro
      - ../applications/so101:/workspace/so101:ro
      - ~/docker/isaac-sim/6.0.1/cache/kit:/isaac-sim/kit/cache:rw
      - ~/docker/isaac-sim/6.0.1/cache/user:/isaac-sim/.cache:rw
      - ~/docker/isaac-sim/6.0.1/cache/ov:/isaac-sim/.cache/ov:rw
      - ~/docker/isaac-sim/6.0.1/cache/pip:/isaac-sim/.cache/pip:rw
      - ~/docker/isaac-sim/6.0.1/cache/glcache:/isaac-sim/.cache/nvidia/GLCache:rw
      - ~/docker/isaac-sim/6.0.1/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
    entrypoint: []
    command: ./python.sh /workspace/so101/scripts/isaacsim_so101.py --urdf /workspace/systems/so101/urdf/so101.urdf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  controller:
    image: cyberphysics/so101
    container_name: so101_controller
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    depends_on:
      - isaacsim
    command: ros2 run so101_description so101_cbf_control.py
