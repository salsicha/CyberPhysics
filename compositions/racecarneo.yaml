# The ROS containers do not share /dev/shm, so FastDDS uses UDP only
# (FASTDDS_BUILTIN_TRANSPORTS), with 4 MiB socket buffers: the 208 KiB
# default dropped 640x480 colour and depth frames for best-effort
# subscribers (applications/racecarneo/README.md).
services:
  racecarneo_sim:
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_sim
    # run_headless_sim.sh starts a level and enters user-program mode by
    # driving the simulator's menu on its Xvfb display (see the README).
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RACECAR_XVFB_SERVER_ARGS=${RACECAR_XVFB_SERVER_ARGS:--screen 0 1280x720x24}
      - RACECAR_SIM_LOG_FILE=${RACECAR_SIM_LOG_FILE:-/dev/stdout}
      - RACECAR_SIM_GRAPHICS_API=${RACECAR_SIM_GRAPHICS_API:-auto}
      # Vulkan rendering on the GPU (graphics capability); software OpenGL
      # without it runs the simulator at only a few frames per second.
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility
    command: >
      /workspace/run_headless_sim.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, graphics, utility]

  # Sensor frames (base_link -> racecarneo/*) from the URDF, the same
  # source the hardware stack uses; the bridge publishes only odom -> base_link.
  racecarneo_robot_state_publisher:
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_robot_state_publisher
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
    volumes:
      - ../systems/racecarneo:/workspace/racecarneo:ro
    command: >
      ros2 launch /workspace/racecarneo/launch/racecarneo_description.launch.py
        camera_optical_frames:=true
        sim_geometry:=true

  racecarneo_bridge:
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_bridge
    depends_on:
      - racecarneo_sim
      - racecarneo_robot_state_publisher
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
      - RACECAR_SIM_IP=${RACECAR_SIM_IP:-127.0.0.1}
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
    command: >
      python3 /workspace/racecarneo_ros_bridge.py
        --ros-args
        --params-file /workspace/config/bridge.yaml

  racecarneo_cmd_vel_to_ackermann:
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_cmd_vel_to_ackermann
    depends_on:
      - racecarneo_bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
    # The simulated car is smaller than the hardware one this config describes:
    # use its wheelbase and 20 deg steering lock (bridge.yaml) so Nav2's
    # curvature reaches the simulator unchanged.
    command: >
      python3 /workspace/cmd_vel_to_ackermann.py
        --ros-args
        --params-file /workspace/config/cmd_vel_to_ackermann.yaml
        -p wheelbase:=0.225
        -p max_steering_angle:=0.349


  # Publishes /depth_anything/depth/image and points as on the car, but
  # nvblox maps the simulator's own depth (below).
  racecarneo_depthanything:
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:depthanything-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_depthanything
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    depends_on:
      - racecarneo_bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
    command: >
      ros2 launch depthanything_pkg depthanything.launch.py
        image_topic:=/camera/color/image_raw
        camera_info_topic:=/camera/color/camera_info
        depth_topic:=/depth_anything/depth/image
        pointcloud_topic:=/depth_anything/points
        metric_dataset:=vkitti
        encoder:=vits
        max_depth:=80.0
        publish_pointcloud:=true
        pointcloud_stride:=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

  # nvblox integrates the bridge's depth (/camera/depth/image_rect_raw, the
  # simulator's depth camera, registered to the colour camera and described
  # by its camera_info). From the simulated car's camera, 0.12 m above
  # the floor, Depth Anything's vkitti depth reads about 13 times the true
  # depth (applications/depthanything/README.md, "Accuracy"), which put
  # nvblox's obstacles out of reach. The URDF's sim_geometry camera mount
  # is measured from that depth (0.120 m, pitched 0.81 deg up): nvblox
  # takes anything 0.02 m above the floor for an obstacle.
  # RACECAR_NVBLOX_DEPTH_TOPIC=/depth_anything/depth/image maps Depth
  # Anything's depth instead.
  racecarneo_nvblox:
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:nvblox-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_nvblox
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    depends_on:
      - racecarneo_bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,video
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
      - ../applications/nvblox/racecarneo_nvblox.launch.py:/workspace/racecarneo_nvblox.launch.py:ro
    command: >
      ros2 launch /workspace/racecarneo_nvblox.launch.py
        config_file:=/workspace/config/nvblox.yaml
        depth_image_topic:=${RACECAR_NVBLOX_DEPTH_TOPIC:-/camera/depth/image_rect_raw}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

  racecarneo_slam:
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_slam
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    depends_on:
      - racecarneo_bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
    command: >
      ros2 launch slam_toolbox online_async_launch.py
        use_sim_time:=false
        slam_params_file:=/workspace/config/slam_toolbox.yaml

  racecarneo_nav2:
    network_mode: host
    pull_policy: if_not_present
    # The nvblox image ships nvblox_nav2 (NvbloxCostmapLayer) alongside Nav2.
    image: salsicha/cyberphysics:nvblox-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_nav2
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    depends_on:
      - racecarneo_bridge
      - racecarneo_slam
      - racecarneo_cmd_vel_to_ackermann
      - racecarneo_nvblox
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
    command: >
      ros2 launch nav2_bringup navigation_launch.py
        use_sim_time:=false
        params_file:=/workspace/config/nav2.yaml
        autostart:=true


  racecarneo_stack_validator:
    profiles: ["validation"]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_stack_validator
    depends_on:
      - racecarneo_nav2
      - racecarneo_nvblox
      - racecarneo_depthanything
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
    command: >
      python3 /workspace/validate_stack_integration.py
        --timeout-s ${RACECAR_STACK_VALIDATION_TIMEOUT:-90}
        --freshness-s ${RACECAR_STACK_VALIDATION_FRESHNESS:-5}

  racecarneo_mission_runner:
    profiles: ["missions"]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_mission_runner
    depends_on:
      - racecarneo_nav2
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
      - RACECAR_MISSION_ID=${RACECAR_MISSION_ID:-simple_loop}
    volumes:
      - ../systems:/workspace/systems:ro
    command: >
      python3 /workspace/run_nav2_mission.py
        --mission-file /workspace/systems/racecarneo/missions/nav2_waypoints.json
        --mission-id ${RACECAR_MISSION_ID:-simple_loop}

  racecarneo_nicegui:
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:nicegui-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_nicegui
    depends_on:
      - racecarneo_nav2
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4?sockets_size=4194304
    command: >
      python3 /workspace/scripts/main.py

  # Foxglove WebSocket server: connect Foxglove to ws://localhost:8765.
  foxglove_bridge:
    network_mode: host
    image: salsicha/cyberphysics:ros2-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_foxglove_bridge
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev/shm:/dev/shm
    command: >
      stdbuf -o L
      ros2 launch foxglove_bridge foxglove_bridge_launch.xml
