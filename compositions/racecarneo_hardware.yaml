# Physical RACECAR Neo stack.
#
# This stack replaces the simulator bridge with real sensor/actuator contracts.
# Hardware drivers outside this file should publish:
#   /scan          frame_id racecarneo/lidar_link
#   /imu/data_raw  frame_id racecarneo/imu_link
#   wheel odometry or an odom source consumed by SLAM/Nav2 (odom -> base_link)
# A motor bridge should subscribe to:
#   /ackermann_cmd ackermann_msgs in SI units: speed in m/s, steering_angle in
#                  rad, positive left. The RACECAR Neo's own /drive topic takes
#                  ratios of the car's limits, so the motor bridge must divide
#                  by those limits and clamp.
#
# The RealSense publishes /camera/color/* and racecarneo/camera_* frames to
# match systems/racecarneo/config/topics.yaml; robot_state_publisher adds
# base_link -> racecarneo/{camera_link,lidar_link,imu_link} from the URDF.
#
# nvblox maps the RealSense's own depth, aligned to the colour camera
# (/camera/aligned_depth_to_color/image_raw, 16UC1 millimetres), in dynamic
# mode with Nav2 on its static slice (systems/racecarneo/config/
# nvblox_hardware.yaml). From the camera's 0.22 m, Depth Anything's metric
# depth reads about 9 times the true depth and left nvblox's map empty in
# simulation (applications/depthanything/README.md, "Accuracy"), so it runs
# only under the `depthanything` profile, for comparison:
#   docker compose -f compositions/racecarneo_hardware.yaml --profile depthanything up -d
# and RACECAR_NVBLOX_DEPTH_TOPIC=/depth_anything/depth/image with
# RACECAR_NVBLOX_OVERRIDES=/workspace/config/nvblox.yaml maps its depth as
# before (Depth Anything stamps the colour frame's time, which the aligned
# depth's camera_info carries too).
#
# Jetson Orin: JetPack 7.2 and locally built arm64 images. Build, GPU
# smoke check and launch instructions: applications/jetson.md.

# Docker on some hosts (the UNO Q's Debian 13 Docker 26, or any host
# whose containerd runs with LimitNOFILE=infinity) gives containers an
# open-file limit of about 2^30. LTTng-UST, which every ROS 2 Jazzy process
# loads, then allocates and zeroes a 128 MiB descriptor bitmap: about 130 MB
# of extra RAM per node. These are the usual systemd defaults.
x-ros-ulimits: &ros-ulimits
  nofile:
    soft: 1024
    hard: 524288

services:
  # The driver's default resolutions, depth 848x480 (the D4xx's best depth
  # resolution) and colour 640x480 (the camera Isaac models), but at 15 Hz
  # instead of 30: nvblox gets the 15 Hz it was evaluated at in Isaac
  # (2.3 cm of travel per frame at the car's 0.35 m/s), and the Jetson's CPU
  # aligns, converts and sends half as many frames. The aligned depth has
  # the colour camera's size: 640x480 16UC1, 614 kB a frame, 9 MB/s to
  # nvblox. Over USB the camera sends 12 MB/s of depth and 9 MB/s of colour
  # (YUYV), about 170 Mbit/s (hardware/racecarneo.md, "USB").
  racecarneo_camera:
    env_file: [../systems/ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    privileged: true
    image: salsicha/cyberphysics:realsense-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_camera
    ulimits: *ros-ulimits
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/shm:/dev/shm
    command: >
      stdbuf -o L
      ros2 launch realsense2_camera rs_launch.py
        camera_namespace:=/
        camera_name:=camera
        tf_prefix:=racecarneo/
        enable_color:=true
        enable_depth:=true
        rgb_camera.color_profile:=${RACECAR_COLOR_PROFILE:-640x480x15}
        depth_module.depth_profile:=${RACECAR_DEPTH_PROFILE:-848x480x15}
        align_depth.enable:=true
        pointcloud.enable:=false
        enable_gyro:=true
        enable_accel:=true
        unite_imu_method:=2

  racecarneo_robot_state_publisher:
    env_file: [../systems/ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_robot_state_publisher
    ulimits: *ros-ulimits
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - ../systems/racecarneo:/workspace/racecarneo:ro
    # The RealSense driver publishes camera_link -> optical frames itself.
    command: >
      ros2 launch /workspace/racecarneo/launch/racecarneo_description.launch.py
        camera_optical_frames:=false

  racecarneo_cmd_vel_to_ackermann:
    env_file: [../systems/ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_cmd_vel_to_ackermann
    ulimits: *ros-ulimits
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
    command: >
      python3 /workspace/cmd_vel_to_ackermann.py
        --ros-args
        --params-file /workspace/config/cmd_vel_to_ackermann.yaml

  # Optional (`--profile depthanything`): nothing reads its depth by
  # default. For comparison with the RealSense: depth_accuracy record
  # --depth-topic /camera/aligned_depth_to_color/image_raw
  # (applications/depthanything/README.md).
  racecarneo_depthanything:
    env_file: [../systems/ros2/middleware.env]
    profiles: ["depthanything"]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:depthanything-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_depthanything
    ulimits: *ros-ulimits
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    restart: unless-stopped
    depends_on:
      - racecarneo_camera
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: >
      ros2 launch depthanything_pkg depthanything.launch.py
        image_topic:=${RACECAR_COLOR_IMAGE_TOPIC:-/camera/color/image_raw}
        camera_info_topic:=${RACECAR_CAMERA_INFO_TOPIC:-/camera/color/camera_info}
        depth_topic:=/depth_anything/depth/image
        pointcloud_topic:=/depth_anything/points
        metric_dataset:=vkitti
        encoder:=vits
        max_depth:=80.0
        publish_pointcloud:=true
        pointcloud_stride:=4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

  racecarneo_nvblox:
    env_file: [../systems/ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:nvblox-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_nvblox
    ulimits: *ros-ulimits
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    restart: unless-stopped
    depends_on:
      - racecarneo_camera
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,video
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
      - ../applications/nvblox/racecarneo_nvblox.launch.py:/workspace/racecarneo_nvblox.launch.py:ro
    # The aligned depth and its camera_info come from one frame and carry
    # its stamp, which nvblox's exact time sync needs; the camera_info is
    # the colour camera's intrinsics at the colour camera's size.
    command: >
      ros2 launch /workspace/racecarneo_nvblox.launch.py
        config_file:=/workspace/config/nvblox.yaml
        overrides_file:=${RACECAR_NVBLOX_OVERRIDES:-/workspace/config/nvblox_hardware.yaml}
        depth_image_topic:=${RACECAR_NVBLOX_DEPTH_TOPIC:-/camera/aligned_depth_to_color/image_raw}
        depth_camera_info_topic:=/camera/aligned_depth_to_color/camera_info
        color_image_topic:=${RACECAR_COLOR_IMAGE_TOPIC:-/camera/color/image_raw}
        color_camera_info_topic:=${RACECAR_CAMERA_INFO_TOPIC:-/camera/color/camera_info}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]

  racecarneo_slam:
    env_file: [../systems/ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:racecarneo-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_slam
    ulimits: *ros-ulimits
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
    command: >
      ros2 launch slam_toolbox online_async_launch.py
        use_sim_time:=false
        slam_params_file:=/workspace/config/slam_toolbox.yaml

  racecarneo_nav2:
    env_file: [../systems/ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    # The nvblox image ships nvblox_nav2 (NvbloxCostmapLayer) alongside Nav2.
    image: salsicha/cyberphysics:nvblox-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_nav2
    ulimits: *ros-ulimits
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    restart: unless-stopped
    depends_on:
      - racecarneo_slam
      - racecarneo_cmd_vel_to_ackermann
      - racecarneo_nvblox
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - ../systems/racecarneo/config:/workspace/config:ro
    command: >
      ros2 launch nav2_bringup navigation_launch.py
        use_sim_time:=false
        params_file:=/workspace/config/nav2.yaml
        autostart:=true

  # The operator page (port 8080). Its front camera is sized for the car's
  # long-range Wi-Fi HaLow link (a few Mbit/s at range, shared with the
  # turret camera on the RACECAR Turret): 2 Hz, 320 px, JPEG quality 60,
  # and only while its panel is open. Over a local link set the page's
  # defaults (5 Hz, 480 px, 75) or more (applications/nicegui/README.md).
  racecarneo_nicegui:
    env_file: [../systems/ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:nicegui-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_nicegui
    ulimits: *ros-ulimits
    restart: unless-stopped
    depends_on:
      - racecarneo_nav2
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      # Depth light: the RealSense's aligned depth that nvblox reads
      - UI_DEPTH_TOPIC=${UI_DEPTH_TOPIC:-/camera/aligned_depth_to_color/camera_info}
      - UI_CAMERA_HZ=${UI_CAMERA_HZ:-2}
      - UI_CAMERA_MAX_WIDTH=${UI_CAMERA_MAX_WIDTH:-320}
      - UI_CAMERA_JPEG_QUALITY=${UI_CAMERA_JPEG_QUALITY:-60}
    command: >
      python3 /workspace/scripts/main.py

  # Foxglove WebSocket server: connect Foxglove to ws://<car>:8765. A bench
  # tool, over Ethernet or the Jetson's Wi-Fi: camera topics through it
  # saturate the HaLow link.
  racecarneo_foxglove_bridge:
    env_file: [../systems/ros2/middleware.env]
    network_mode: host
    image: salsicha/cyberphysics:ros2-${CYBERPHYSICS_TAG:-latest}
    container_name: racecarneo_foxglove_bridge
    ulimits: *ros-ulimits
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev/shm:/dev/shm
    command: >
      stdbuf -o L
      ros2 launch foxglove_bridge foxglove_bridge_launch.xml
