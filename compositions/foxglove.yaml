
# Foxglove example:
# Foxglove is installed on the host through snap, which should already be done by install.sh
# "sudo snap install foxglove-studio"
# foxglove_bridge serves the ROS graph to it: "Open connection" ->
# "Foxglove WebSocket" -> ws://localhost:8765

services:
  foxglove_bridge:
    network_mode: "host"
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:ros2-latest
    container_name: foxglove_bridge
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev/shm:/dev/shm
    command: >
      stdbuf -o L
      ros2 launch foxglove_bridge foxglove_bridge_launch.xml
