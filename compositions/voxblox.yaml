
# Viewer:
# Run "foxglove-studio" from command line on host
# Select "Open connection" -> "Foxglove WebSocket" -> ws://localhost:8765

services:
  nvblox:
    network_mode: "host"
    privileged: true
    pull_policy: if_not_present
    image: salsicha/cyberphysics:nvblox-latest
    container_name: nvblox
    devices:
      - /dev:/dev
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - "DISPLAY=${DISPLAY}"
      - XAUTHORITY
      - NVIDIA_DRIVER_CAPABILITIES=all
      - EGL_PLATFORM=surfaceless
    volumes:
      - /dev/shm:/dev/shm
      - "/tmp/.X11-unix:/tmp/.X11-unix"
    command: >
      stdbuf -o L
      ros2 launch nvblox_examples_bringup realsense_example.launch.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
  foxglove_bridge:
    network_mode: "host"
    image: salsicha/cyberphysics:ros2-latest
    container_name: foxglove_bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev/shm:/dev/shm
    command: >
      stdbuf -o L
      ros2 launch foxglove_bridge foxglove_bridge_launch.xml
