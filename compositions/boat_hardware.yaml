# Physical BlueBoat stack (hardware/boat.md).

services:
  boat_mavros:
    # MAVLink from BlueOS's router through its internal TCP server (the
    # "Internal Link" endpoint, 127.0.0.1:5777): no BlueOS endpoint to add,
    # and MAVROS joins as component 1:191, which no BlueOS service uses.
    # The old default, UDP 14550 on the Pi, receives nothing on a stock
    # BlueOS. BLUEOS_FCU_URL overrides it (applications/aerostack2/README.md,
    # "BlueOS platform").
    image: salsicha/cyberphysics:boat-${CYBERPHYSICS_TAG:-arm64}
    container_name: boat_mavros
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - ../applications/aerostack2/config:/workspace/mavros_config:ro
    command: >
      ros2 launch /workspace/mavros_config/blueos_mavros.launch.xml
        fcu_url:=${BLUEOS_FCU_URL:-tcp://127.0.0.1:5777}

  boat_bridge:
    image: salsicha/cyberphysics:boat-${CYBERPHYSICS_TAG:-arm64}
    container_name: boat_bridge
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - boat_mavros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - ../systems/boat/config:/workspace/config:ro
      - /dev/shm:/dev/shm
    command: >
      mavros_mirror
        --ros-args
        --params-file /workspace/config/bridge.yaml
        -p namespace:=${BOAT_NAMESPACE:-boat0}

  boat_message_rates:
    # Asks ArduRover for the telemetry rates the bridge needs
    # (systems/boat/config/message_rates.yaml; its own stream rates gave
    # /mavros/imu/data at about 1 Hz) at start, after every MAVROS
    # reconnect, and when the attitude stream drops (an autopilot reboot):
    # systems/boat/README.md, "Telemetry rates". It sends only message
    # interval commands: no parameter writes, modes or arming.
    image: salsicha/cyberphysics:boat-${CYBERPHYSICS_TAG:-arm64}
    container_name: boat_message_rates
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - boat_mavros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
      - ../systems/boat/config:/workspace/config:ro
      - /dev/shm:/dev/shm
    command: >
      python3 /workspace/applications/aerostack2/scripts/mavros_message_rates.py
        --namespace /mavros --rates /workspace/config/message_rates.yaml

  boat_rosbridge:
    # Port 9092: BlueOS's Cable Guy holds 9090 on the host network. Host
    # IPC and /dev/shm, or Fast DDS's shared-memory transport delivers it
    # no messages (compositions/blueos_nav_core.yaml).
    image: salsicha/cyberphysics:boat-${CYBERPHYSICS_TAG:-arm64}
    container_name: boat_rosbridge
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - /dev/shm:/dev/shm
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9092
