# BlueBoat dynamics and control are provided by ArduRover SITL, the same
# ArduPilot control layer that BlueOS runs against Navigator hardware.
services:
  navigator_sitl:
    image: cyberphysics/navigator:${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    environment:
      ARDUPILOT_VEHICLE: Rover
      ARDUPILOT_FRAME: rover
      ARDUPILOT_PARAM_FILE: /workspace/systems/boat/config/ardurover.params
      INITIAL_LAT: ${INITIAL_LAT:-37.9234}
      INITIAL_LON: ${INITIAL_LON:--122.5967}
      ORIGIN_ALT: ${ORIGIN_ALT:-0.0}
    volumes:
      - ../applications/ardupilot_sitl/scripts:/workspace/applications/ardupilot_sitl/scripts:ro
      - ../systems/boat:/workspace/systems/boat:ro
    command: /workspace/applications/ardupilot_sitl/scripts/run_vehicle_sitl.sh

  mavros:
    image: cyberphysics/aerostack2:${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on: [navigator_sitl]
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    command: ros2 launch mavros apm.launch fcu_url:=tcp://127.0.0.1:5760

  boat_bridge:
    image: cyberphysics/boat:${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on: [mavros]
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    volumes: [../systems/boat/config:/workspace/config:ro, /dev/shm:/dev/shm]
    command: mavros_mirror --ros-args --params-file /workspace/config/bridge_sim.yaml

  navigator_arm:
    image: cyberphysics/aerostack2:${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    depends_on: [boat_bridge]
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    volumes: [../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro]
    command: python3 /workspace/applications/aerostack2/scripts/arm_mavros.py --mode GUIDED
    restart: "no"

  harbor_waypoint_nav:
    image: cyberphysics/boat:${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on:
      navigator_arm: {condition: service_completed_successfully}
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    volumes: [../systems/boat/config:/workspace/config:ro, /dev/shm:/dev/shm]
    command: >
      python3 /scripts/harbor_waypoint_nav.py --ros-args
        --params-file /workspace/config/harbor_survey.yaml

  boat_rosbridge:
    image: cyberphysics/boat:${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml
