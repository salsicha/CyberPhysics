# Blackfly camera test
#
# Required env:  CAMERA_SERIAL1  serial number of the Blackfly camera; the
#                                camera service exits at once when it is unset.
# Optional env:  ROS_DOMAIN_ID
#
# The record service's /shutdown (power off the host) service is disabled.
# To enable it on a dedicated rig, add the opt-in override:
#   docker compose -f compositions/blackfly.yaml \
#     -f systems/components/record-host-shutdown.yaml up

version: "3.9"
services:
  blackfly_autoconfigure_ip:
    env_file: [../systems/ros2/middleware.env]
    network_mode: "host"
    ipc: "host"
    image: salsicha/cyberphysics:blackfly-latest
    environment:
      - EXPECTED_NUM_BLACKFLY_CAMERAS=1
    command: /bin/bash -c "/scripts/blackfly-autoconfigure-ip.sh $$EXPECTED_NUM_BLACKFLY_CAMERAS"
  blackfly:
    env_file: [../systems/ros2/middleware.env]
    restart: unless-stopped
    network_mode: "host"
    ipc: "host"
    image: salsicha/cyberphysics:blackfly-latest
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}  # 0 is default value, to isolate ROS2 msgs use a domain id between 1-101
      - CAMERA_SERIAL1=${CAMERA_SERIAL1:-}
    command:
      - bash
      - -c
      - >-
        if [ -z "$$CAMERA_SERIAL1" ]; then
        echo "CAMERA_SERIAL1 is not set: export the Blackfly serial number before docker compose up" >&2;
        exit 1; fi;
        exec ros2 launch spinnaker_camera_driver blackfly_s_gige.launch.py
        camera_name:=blackfly_1 serial:="'$$CAMERA_SERIAL1'" frame_rate:=10
  record:
    env_file: [../systems/ros2/middleware.env]
    restart: always
    pull_policy: never
    image: salsicha/cyberphysics:record-latest
    network_mode: host
    volumes:
      - /dev/shm:/dev/shm
      - /data:/data
      - ../systems/blackfly/env/:/env:ro
    environment:
      - TOPICS_EXCLUDED="-x '(.*)/image|(.*)/image_color|(.*)/image_mono|(.*)/image_proc_debayer/(.*)'"
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}  # 0 is default value, to isolate ROS2 msgs use a domain id between 1-101
    command: >
      stdbuf -o L
      bash -c "env; python3 record.py --proj_name local --server_w_ip 127.0.0.1 --server_eth_ip 127.0.0.1"

