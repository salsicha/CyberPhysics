# Physical BlueROV2 stack (hardware/submarine.md).

services:
  submarine_mavros:
    # MAVLink from BlueOS's router through its internal TCP server (the
    # "Internal Link" endpoint, 127.0.0.1:5777): no BlueOS endpoint to add,
    # and MAVROS joins as component 1:191, which no BlueOS service uses.
    # The old default, UDP 14550 on the Pi, receives nothing on a stock
    # BlueOS. BLUEOS_FCU_URL overrides it (applications/aerostack2/README.md,
    # "BlueOS platform").
    image: salsicha/cyberphysics:submarine-${CYBERPHYSICS_TAG:-arm64}
    container_name: submarine_mavros
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    command: >
      ros2 launch mavros apm.launch
        fcu_url:=${BLUEOS_FCU_URL:-tcp://127.0.0.1:5777}

  submarine_bridge:
    # /sub0/sensor_measurements/*. The pressure is the external depth
    # sensor's SCALED_PRESSURE2, decoded from MAVROS's raw MAVLink stream;
    # without one, the Navigator's own barometer with a warning
    # (config/bridge.yaml; systems/submarine/README.md, "Depth pressure").
    image: salsicha/cyberphysics:submarine-${CYBERPHYSICS_TAG:-arm64}
    container_name: submarine_bridge
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - submarine_mavros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ../systems/submarine/config:/workspace/config:ro
      - /dev/shm:/dev/shm
    command: >
      mavros_mirror
        --ros-args
        --params-file /workspace/config/bridge.yaml
        -p namespace:=${SUBMARINE_NAMESPACE:-sub0}

  submarine_message_rates:
    # Asks ArduSub for the telemetry rates the bridge needs
    # (systems/submarine/config/message_rates.yaml; its default streams
    # send RAW_IMU, the pressure and GPS_RAW_INT at 2 Hz) at start, after
    # every MAVROS reconnect, and when the attitude stream drops (an
    # autopilot reboot):
    # systems/submarine/README.md, "Telemetry rates". It sends only message
    # interval commands: no parameter writes, modes or arming.
    image: salsicha/cyberphysics:submarine-${CYBERPHYSICS_TAG:-arm64}
    container_name: submarine_message_rates
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - submarine_mavros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
      - ../systems/submarine/config:/workspace/config:ro
      - /dev/shm:/dev/shm
    command: >
      python3 /workspace/applications/aerostack2/scripts/mavros_message_rates.py
        --namespace /mavros --rates /workspace/config/message_rates.yaml

  submarine_rosbridge:
    # Port 9092: BlueOS's Cable Guy holds 9090 on the host network. Host
    # IPC and /dev/shm, or Fast DDS's shared-memory transport delivers it
    # no messages (compositions/blueos_nav_core.yaml).
    image: salsicha/cyberphysics:submarine-${CYBERPHYSICS_TAG:-arm64}
    container_name: submarine_rosbridge
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev/shm:/dev/shm
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9092
