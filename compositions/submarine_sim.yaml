# BlueROV2 dynamics and control are provided by ArduSub SITL, the same
# ArduPilot control layer that BlueOS runs against Navigator hardware.
services:
  navigator_sitl:
    image: salsicha/cyberphysics:navigator-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    environment:
      ARDUPILOT_VEHICLE: ArduSub
      ARDUPILOT_FRAME: vectored
      # Hardware baseline, then SITL-only relaxations (never on the vehicle).
      ARDUPILOT_PARAM_FILE: /workspace/systems/submarine/config/ardusub.params
      ARDUPILOT_SITL_PARAM_FILE: /workspace/systems/submarine/config/ardusub_sitl.params
      INITIAL_LAT: ${INITIAL_LAT:-37.9234}
      INITIAL_LON: ${INITIAL_LON:--122.5967}
      ORIGIN_ALT: ${ORIGIN_ALT:-0.0}
    volumes:
      - ../applications/ardupilot_sitl/scripts:/workspace/applications/ardupilot_sitl/scripts:ro
      - ../systems/submarine:/workspace/systems/submarine:ro
    command: /workspace/applications/ardupilot_sitl/scripts/run_vehicle_sitl.sh

  mavros:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    depends_on: [navigator_sitl]
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    command: ros2 launch mavros apm.launch fcu_url:=tcp://127.0.0.1:5760

  submarine_bridge:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:submarine-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on: [mavros]
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    volumes: [../systems/submarine/config:/workspace/config:ro, /dev/shm:/dev/shm]
    command: mavros_mirror --ros-args --params-file /workspace/config/bridge_sim.yaml

  navigator_arm:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    # Same IPC namespace as MAVROS: Fast DDS picks shared-memory transport
    # between host-network containers, and without it no MAVROS state
    # arrives and arming times out.
    ipc: host
    depends_on: [submarine_bridge]
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    volumes: [../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro]
    command: python3 /workspace/applications/aerostack2/scripts/arm_mavros.py --mode GUIDED
    restart: "no"

  pipeline_waypoint_nav:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:submarine-${CYBERPHYSICS_TAG:-latest}
    network_mode: host
    ipc: host
    depends_on:
      navigator_arm: {condition: service_completed_successfully}
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    volumes: [../systems/submarine/config:/workspace/config:ro, /dev/shm:/dev/shm]
    command: >
      python3 /scripts/pipeline_waypoint_nav.py --ros-args
        --params-file /workspace/config/pipeline_inspection.yaml

  submarine_rosbridge:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:submarine-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    environment: {ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"}
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml
