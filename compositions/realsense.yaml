
services:
  realsense:
    network_mode: "host"
    pull_policy: if_not_present
    privileged: true
    image: salsicha/cyberphysics:realsense-latest
    container_name: realsense
    volumes:
      - /dev/shm:/dev/shm
    command: >
      stdbuf -o L
      ros2 launch realsense2_camera rs_launch.py
  foxglove_bridge:
    network_mode: "host"
    image: salsicha/cyberphysics:ros2-latest
    container_name: foxglove_bridge
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev/shm:/dev/shm
    command: >
      stdbuf -o L
      ros2 launch foxglove_bridge foxglove_bridge_launch.xml
