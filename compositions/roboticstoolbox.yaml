
# RoboticsToolbox

services:
  roboticstoolbox:
    network_mode: "host"
    image: salsicha/cyberphysics:roboticstoolbox-latest
    container_name: roboticstoolbox
    environment:
      - "DISPLAY=${DISPLAY}"
      - XAUTHORITY=/tmp/.XAuthority
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - /dev/shm:/dev/shm
      - ${XAUTHORITY:-/tmp/.Xauthority}:/tmp/.XAuthority:ro
    # rtbtool is an interactive shell; run it in the foreground with
    #   docker compose -f compositions/roboticstoolbox.yaml run --rm roboticstoolbox
    # or "docker attach roboticstoolbox" after "up -d"
    stdin_open: true
    tty: true
    command: rtbtool

