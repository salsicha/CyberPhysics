
# RAI

services:
  rai:
    network_mode: "host"
    image: salsicha/cyberphysics:rai-latest
    container_name: rai
    environment:
      - "DISPLAY=${DISPLAY}"
      - XAUTHORITY=/tmp/.XAuthority
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
      - /dev/shm:/dev/shm
      - ${XAUTHORITY:-/tmp/.Xauthority}:/tmp/.XAuthority:ro
    # Default command: the RAI configurator web UI on http://localhost:8501
