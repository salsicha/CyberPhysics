# Physical Aerodrone stack.
#
# This is the Raspberry Pi/BlueOS/OAK-1 hardware composition for the one
# Aerodrone described in hardware/aerodrone.txt and systems/aerodrone/.

include:
  - blueos_aerostack.yaml

x-aerodrone-system: &aerodrone-system
  env_file: [../systems/aerodrone/config/topics.env]

# Merge the canonical physical interface into every included service. Scenario
# coordinates remain deployment inputs and do not belong in systems/aerodrone.
services:
  mavros: *aerodrone-system
  oak1: *aerodrone-system
  demnav: *aerodrone-system
  wildnav: *aerodrone-system
  rosbridge: *aerodrone-system
  aerostack: *aerodrone-system
  behavior_tree: *aerodrone-system
  aerostack_gui: *aerodrone-system
