# Physical Aerodrone stack.
#
# This is the Raspberry Pi/BlueOS/OAK-1 hardware composition for the one
# Aerodrone described in hardware/aerodrone.md and systems/aerodrone/.

include:
  # Interpolate the included commands with the physical vehicle identity.
  # Service env_file entries only set container variables after interpolation.
  - path: blueos_aerostack.yaml
    env_file: ../systems/aerodrone/config/topics.env

services:
  rangefinder:
    # Benewake TFmini-S/TF-Luna, downward, on a 3.3 V USB-UART adapter
    # (applications/rangefinder). Publishes sensor_msgs/Range on
    # RANGEFINDER_TOPIC, DemNav's height-above-ground input. Set
    # RANGEFINDER_DEVICE (a stable /dev/serial/by-id/ path) and
    # RANGEFINDER_MODEL (tfmini_s or tf_luna) in the shell; the include
    # env_file above does not apply to this file's own services.
    image: salsicha/cyberphysics:rangefinder-${CYBERPHYSICS_TAG:-arm64}
    container_name: rangefinder
    # Docker on some hosts (the UNO Q's Debian 13 Docker 26, or any host
    # whose containerd runs with LimitNOFILE=infinity) gives containers an
    # open-file limit of about 2^30. LTTng-UST, which every ROS 2 Jazzy process
    # loads, then allocates and zeroes a 128 MiB descriptor bitmap: about 130 MB
    # of extra RAM per node. These are the usual systemd defaults.
    ulimits:
      nofile:
        soft: 1024
        hard: 524288
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    # The adapter reaches the container through the host's /dev, mounted
    # read-only at /host/dev, and these device cgroup rules (USB serial:
    # ttyUSB* is major 188, ttyACM* 166), not through `devices:`. Docker
    # refuses to start a container whose `devices:` entry does not exist,
    # and `docker compose up` then stops with most of the stack never
    # started (seen on the Pi 5 with no adapter plugged in). This way the
    # node retries every second until the adapter appears, reopens it after
    # an unplug, and a by-id path keeps working when it re-enumerates.
    device_cgroup_rules:
      - 'c 188:* rmw'
      - 'c 166:* rmw'
    volumes:
      - /dev:/host/dev:ro
      - /dev/shm:/dev/shm
    command: >
      python3 /scripts/rangefinder_node.py --ros-args
        -p port:=/host${RANGEFINDER_DEVICE:-/dev/ttyUSB0}
        -p model:=${RANGEFINDER_MODEL:-tfmini_s}
        -p topic:=${RANGEFINDER_TOPIC:-/aerodrone/rangefinder}
        -p frame_id:=rangefinder_link
