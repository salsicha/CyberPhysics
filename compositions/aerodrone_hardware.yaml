# Physical Aerodrone stack.
#
# This is the Raspberry Pi/BlueOS/OAK-1 hardware composition for the one
# Aerodrone described in hardware/aerodrone.txt and systems/aerodrone/.

include:
  # Interpolate the included commands with the physical vehicle identity.
  # Service env_file entries only set container variables after interpolation.
  - path: blueos_aerostack.yaml
    env_file: ../systems/aerodrone/config/topics.env
