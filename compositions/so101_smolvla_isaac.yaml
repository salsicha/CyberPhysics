# SO101 closed-loop simulation with a LeRobot SmolVLA policy.
# This stack is independent of so101_groot_isaac.yaml and does not replace it.
# Add --profile observe to expose ROS topics through rosbridge.

services:
  isaacsim_xauth_init:
    profiles: [sim]
    image: cyberphysics/isaac:${CYBERPHYSICS_TAG:-latest}
    user: "0:0"
    network_mode: none
    volumes:
      - ${XAUTHORITY:-/tmp/.Xauthority}:/host.Xauthority:ro
      - so101_smolvla_isaac_xauth:/workspace/xauth:rw
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        if [ -f /host.Xauthority ]; then
          cp /host.Xauthority /workspace/xauth/Xauthority
          chown 1234:1234 /workspace/xauth/Xauthority
          chmod 0600 /workspace/xauth/Xauthority
        else
          rm -f /workspace/xauth/Xauthority
        fi
    restart: "no"

  isaacsim_cache_init:
    profiles: [sim]
    image: cyberphysics/isaac:${CYBERPHYSICS_TAG:-latest}
    user: "0:0"
    network_mode: none
    volumes:
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/kit:/isaac-sim/kit/cache:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/user:/isaac-sim/.cache:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/ov:/isaac-sim/.cache/ov:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/pip:/isaac-sim/.cache/pip:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/glcache:/isaac-sim/.cache/nvidia/GLCache:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/computecache:/isaac-sim/.nv/ComputeCache:rw
      - ../data/smolvla/telemetry:/workspace/telemetry:rw
    entrypoint: ["/bin/chown"]
    command:
      - "1234:1234"
      - /isaac-sim/kit/cache
      - /isaac-sim/.cache
      - /isaac-sim/.cache/ov
      - /isaac-sim/.cache/pip
      - /isaac-sim/.cache/nvidia/GLCache
      - /isaac-sim/.nv/ComputeCache
      - /workspace/telemetry
    restart: "no"

  isaacsim:
    profiles: [sim]
    image: cyberphysics/isaac:${CYBERPHYSICS_TAG:-latest}
    container_name: so101_smolvla_isaacsim
    depends_on:
      isaacsim_cache_init:
        condition: service_completed_successfully
      isaacsim_xauth_init:
        condition: service_completed_successfully
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=${PRIVACY_CONSENT:-Y}
      - XAUTHORITY=/isaac-sim/.xauth/Xauthority
      - ROS_DISTRO=jazzy
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - LD_LIBRARY_PATH=/isaac-sim/exts/isaacsim.ros2.core/jazzy/lib
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-graphics,utility,compute}
      - SO101_HEADLESS=${SO101_HEADLESS:-false}
      - SO101_LOG_HEARTBEAT_SECONDS=${SO101_LOG_HEARTBEAT_SECONDS:-30}
      - SO101_ISAAC_WINDOW_X=${SO101_ISAAC_WINDOW_X:-0}
      - SO101_ISAAC_WINDOW_Y=${SO101_ISAAC_WINDOW_Y:-0}
      - SO101_ISAAC_WINDOW_WIDTH=${SO101_ISAAC_WINDOW_WIDTH:-1440}
      - SO101_ISAAC_WINDOW_HEIGHT=${SO101_ISAAC_WINDOW_HEIGHT:-900}
      - SO101_ISAAC_X11_WORKAREA_FIX=${SO101_ISAAC_X11_WORKAREA_FIX:-true}
      - SO101_ISAAC_JOINT_DRIVE_TYPE=${SO101_ISAAC_JOINT_DRIVE_TYPE:-force}
      - SO101_ISAAC_JOINT_STIFFNESS=${SO101_ISAAC_JOINT_STIFFNESS:-400}
      - SO101_ISAAC_JOINT_DAMPING=${SO101_ISAAC_JOINT_DAMPING:-40}
      - SO101_TASK_ID=${SO101_TASK_ID:-pick_red_block_left_bin}
      - SO101_TASK_TELEMETRY=/workspace/telemetry/so101_task_telemetry.json
    volumes:
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix
      - so101_smolvla_isaac_xauth:/isaac-sim/.xauth:ro
      - ../systems:/workspace/systems:ro
      - ../applications/so101:/workspace/so101:ro
      - ../data/smolvla/telemetry:/workspace/telemetry:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/kit:/isaac-sim/kit/cache:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/user:/isaac-sim/.cache:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/ov:/isaac-sim/.cache/ov:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/pip:/isaac-sim/.cache/pip:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/glcache:/isaac-sim/.cache/nvidia/GLCache:rw
      - ${CYBERPHYSICS_ISAAC_CACHE:-/tmp/cyberphysics/isaac-sim/6.0.1/so101}/computecache:/isaac-sim/.nv/ComputeCache:rw
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/so101_isaac_ready"]
      interval: 5s
      timeout: 2s
      start_period: 180s
      retries: 3
    entrypoint: []
    command: >
      ./python.sh /workspace/so101/scripts/isaacsim_so101.py
        --urdf /workspace/systems/so101/urdf/so101.urdf
        --scenario /workspace/systems/so101/scenarios/picking_table.json
        --task-id ${SO101_TASK_ID:-pick_red_block_left_bin}
        --task-telemetry /workspace/telemetry/so101_task_telemetry.json
        --camera-source ${SO101_ISAAC_CAMERA_SOURCE:-rendered}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  smolvla_policy:
    profiles: [sim]
    image: cyberphysics/smolvla:${CYBERPHYSICS_TAG:-latest}
    build:
      context: ../applications/smolvla
      args:
        LEROBOT_REF: ${LEROBOT_REF:-v0.6.0}
    container_name: so101_smolvla_policy
    network_mode: host
    ipc: host
    gpus: all
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/workspace/cache/huggingface
      - HF_HUB_CACHE=/workspace/cache/huggingface/hub
      - HF_HUB_DOWNLOAD_TIMEOUT=${HF_HUB_DOWNLOAD_TIMEOUT:-600}
      - TORCH_HOME=/workspace/cache/torch
      - HF_TOKEN=${HF_TOKEN:-}
      - SMOLVLA_MODEL_PATH=${SMOLVLA_MODEL_PATH:-lerobot/smolvla_base}
      - SMOLVLA_DEVICE=${SMOLVLA_DEVICE:-cuda}
      - SMOLVLA_CHECKPOINT_UNITS=${SMOLVLA_CHECKPOINT_UNITS:-so101}
      - SMOLVLA_ACTION_HORIZON=${SMOLVLA_ACTION_HORIZON:-8}
      - SMOLVLA_LOCAL_FILES_ONLY=${SMOLVLA_LOCAL_FILES_ONLY:-false}
      - SMOLVLA_PORT=${SMOLVLA_PORT:-5556}
    volumes:
      - ../data/smolvla:/workspace/data
      - ../cache/smolvla:/workspace/cache
      - ../applications/smolvla/scripts:/workspace/smolvla_scripts:ro
    command: >
      python /workspace/smolvla_scripts/so101_policy_server.py
        --model-path ${SMOLVLA_MODEL_PATH:-lerobot/smolvla_base}
        --device ${SMOLVLA_DEVICE:-cuda}
        --checkpoint-units ${SMOLVLA_CHECKPOINT_UNITS:-so101}
        --action-horizon ${SMOLVLA_ACTION_HORIZON:-8}
        --port ${SMOLVLA_PORT:-5556}
    healthcheck:
      test: ["CMD", "python", "/workspace/smolvla_scripts/policy_healthcheck.py"]
      interval: 15s
      timeout: 8s
      start_period: 10m
      retries: 4

  so101_smolvla_bridge:
    profiles: [sim]
    image: cyberphysics/so101:${CYBERPHYSICS_TAG:-latest}
    container_name: so101_smolvla_bridge
    network_mode: host
    depends_on:
      isaacsim:
        condition: service_healthy
      smolvla_policy:
        condition: service_healthy
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTDDS_BUILTIN_TRANSPORTS=UDPv4
    volumes:
      - ../systems:/workspace/systems:ro
      - ../applications/so101/scripts:/workspace/so101_scripts:ro
    command: >
      python3 /workspace/so101_scripts/groot_so101_bridge.py
        --ros-args
        --params-file /workspace/systems/so101/config/groot_demo.yaml
        -p policy_host:=127.0.0.1
        -p policy_port:=${SMOLVLA_PORT:-5556}
        -p policy_timeout_ms:=${SMOLVLA_POLICY_TIMEOUT_MS:-30000}
        -p policy_schema:=auto
        -p task_id:=${SO101_TASK_ID:-pick_red_block_left_bin}
        -p max_joint_step:=${SO101_MAX_JOINT_STEP:-0.08}

  foxglove_bridge:
    profiles: [observe]
    image: cyberphysics/ros2:${CYBERPHYSICS_TAG:-latest}
    container_name: so101_smolvla_foxglove_bridge
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev/shm:/dev/shm
    command: >
      stdbuf -o L
      ros2 launch rosbridge_server rosbridge_websocket_launch.xml

volumes:
  so101_smolvla_isaac_xauth:
