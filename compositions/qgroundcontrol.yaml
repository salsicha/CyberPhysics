# This deployment targets native Ubuntu host

services:
  qgroundcontrol:
    network_mode: "host"
    image: salsicha/cyberphysics:qgroundcontrol-latest
    container_name: qgroundcontrol
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix"
    environment:
      - "DISPLAY=${DISPLAY}"
    # QGroundControl runs as the image's uid 1000 user (it refuses to run as root)
    command: QGroundControl

