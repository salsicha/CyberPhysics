# Shared BlueOS navigation core: MAVROS, the ArduPilot navigation bridge
# (EKF origin on /navigation/origin), OAK-1 MegaDepth camera, DemNav,
# WildNav, and rosbridge.
#
# Defaults render the drone deployment (blueos_aerostack.yaml includes this
# file unmodified). Other vehicles include it with an env_file that
# overrides the *_CONTAINER names, camera topic root/frame, namespace,
# navigation topic, cache paths, and scenario values — see
# airplane_hardware.yaml with systems/airplane/config/blueos.env.

services:
  mavros:
    # MAVLink from BlueOS's router through its internal TCP server (the
    # "Internal Link" endpoint, 127.0.0.1:5777): no BlueOS endpoint to add,
    # and MAVROS joins as component 1:191, which no BlueOS service uses.
    # The old default, UDP 14550 on the Pi, receives nothing on a stock
    # BlueOS. BLUEOS_FCU_URL overrides it (applications/aerostack2/README.md,
    # "BlueOS platform").
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-arm64}
    container_name: ${MAVROS_CONTAINER:-mavros}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - ../applications/aerostack2/config:/workspace/mavros_config:ro
    command: >
      ros2 launch /workspace/mavros_config/blueos_mavros.launch.xml
        fcu_url:=${BLUEOS_FCU_URL:-tcp://127.0.0.1:5777}

  navigation_bridge:
    # Relays the ArduPilot EKF origin to /navigation/origin, the anchor of
    # every local navigation output. By default (GPS_INPUT_CORRECTIONS=true;
    # the airplane's blueos.env sets false: copter only) it also sends
    # accepted DemNav/WildNav fixes to ArduPilot as GPS 2, but only once the
    # autopilot reports systems/aerodrone/config/arducopter_gps_input.params,
    # which must be loaded on it by hand (systems/aerodrone/README.md); the
    # bridge never writes EKF source parameters.
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-arm64}
    container_name: ${NAVIGATION_BRIDGE_CONTAINER:-navigation_bridge}
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - mavros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - /dev/shm:/dev/shm
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
    command: >
      python3 /workspace/applications/aerostack2/scripts/ardupilot_navigation_bridge.py
        --ros-args -p mavros_namespace:=/mavros
        -p gps_input_enabled:=${GPS_INPUT_CORRECTIONS:-true}
        -p correction_topic:=${NAVIGATION_TOPIC_PREFIX:-/navigation}/correction_fix
        -p autopilot_corrections_topic:=${NAVIGATION_TOPIC_PREFIX:-/navigation}/autopilot_corrections_active

  oak1:
    # MegaDepth for DemNav and stills for WildNav, and the object-tracking
    # detector (systems/aerodrone/tracking.md): YOLO and DepthAI's
    # ObjectTracker on the camera's Myriad X, publishing
    # TRACKING_TOPIC_PREFIX/detections, /image/compressed and /camera_info.
    # On by default (OAK1_TRACKING=false turns it off; the airplane's
    # blueos.env does). The detector and MegaDepth share the Myriad X: while
    # the detector runs at OAK1_TRACKING_RATE_HZ (5) MegaDepth runs ~2.9 Hz
    # instead of ~4.6 Hz, so it runs only while something subscribes to the
    # tracking topics (applications/oak1/README.md, "Object tracking").
    image: salsicha/cyberphysics:oak1-${CYBERPHYSICS_TAG:-arm64}
    container_name: ${OAK1_CONTAINER:-oak1}
    network_mode: host
    ipc: host
    privileged: true
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - /dev/bus/usb:/dev/bus/usb
      - /dev/shm:/dev/shm
    command: >
      python3 /scripts/megadepth_ros.py --ros-args
        -p device_ip:=${OAK1_DEVICE_IP:-auto}
        -p blob_path:=/models/megadepth_192x256_openvino_2021.4_6shave.blob
        -p image_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/image_raw
        -p depth_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/relative_depth
        -p camera_info_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/camera_info
        -p highres_image_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/image_highres
        -p highres_camera_info_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/image_highres/camera_info
        -p highres_width:=${WILDNAV_IMAGE_WIDTH:-1280}
        -p highres_height:=${WILDNAV_IMAGE_HEIGHT:-720}
        -p highres_capture_hz:=${WILDNAV_IMAGE_RATE:-0.5}
        -p frame_id:=${CAMERA_FRAME_ID:-oak1_optical_frame}
        -p tracking_enabled:=${OAK1_TRACKING:-true}
        -p tracking_model:=/models/${TRACKING_DETECTOR_MODEL:-visdrone_yolov8n_640x352}.json
        -p tracking_topic_prefix:=${TRACKING_TOPIC_PREFIX:-/tracking}
        -p tracking_rate_hz:=${OAK1_TRACKING_RATE_HZ:-5.0}

  demnav:
    image: salsicha/cyberphysics:demnav-${CYBERPHYSICS_TAG:-arm64}
    container_name: ${DEMNAV_CONTAINER:-demnav}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - oak1
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - /dev/shm:/dev/shm
      - ${DEMNAV_CACHE_HOST:-/data/demnav_cache}:/data/demnav_cache
    command: >
      ros2 launch demnav_pkg demnav.launch.py
        gps_topic:=/${VEHICLE_NAMESPACE:-${DRONE_NAMESPACE:-drone0}}/sensor_measurements/gps
        odom_topic:=/${VEHICLE_NAMESPACE:-${DRONE_NAMESPACE:-drone0}}/sensor_measurements/odom
        depth_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/relative_depth
        camera_info_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/camera_info
        initial_lat:=${INITIAL_LAT:-0.0}
        initial_lon:=${INITIAL_LON:-0.0}
        area_km:=${AREA_KM:-10.0}
        search_radius_m:=${SEARCH_RADIUS_M:-200.0}
        fov_deg:=${FOV_DEG:-69.0}
        min_correlation:=${MIN_CORRELATION:-0.35}
        origin_topic:=/navigation/origin
        prior_fix_topic:=${NAVIGATION_TOPIC_PREFIX:-/navigation}/fix
        prior_timeout_s:=2.0
        search_radius_sigma_scale:=3.0
        max_search_radius_m:=${MAX_SEARCH_RADIUS_M:-600.0}
        camera_mount_yaw_deg:=${CAMERA_MOUNT_YAW_DEG:-0.0}
        gps_altitude_datum:=ellipsoid
        geoid_file:=/usr/share/GeographicLib/geoids/egm96-5.pgm
        "rangefinder_topic:=${RANGEFINDER_TOPIC:-''}"
        rangefinder_timeout_s:=0.5

  wildnav:
    image: salsicha/cyberphysics:wildnav-${CYBERPHYSICS_TAG:-arm64}
    container_name: ${WILDNAV_CONTAINER:-wildnav}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - demnav
      - oak1
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
      - WILDNAV_TILE_URL
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - /dev/shm:/dev/shm
      - ${WILDNAV_CACHE_HOST:-/data/wildnav_cache}:/data/wildnav_cache
    command: >
      ros2 launch wildnav_pkg wildnav.launch.py
        image_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/image_highres
        camera_info_topic:=${CAMERA_TOPIC_ROOT:-/oak1}/image_highres/camera_info
        prediction_odom_topic:=${NAVIGATION_ODOM_TOPIC:-/navigation/odometry}
        raw_odom_topic:=/${VEHICLE_NAMESPACE:-${DRONE_NAMESPACE:-drone0}}/sensor_measurements/odom
        gps_topic:=/${VEHICLE_NAMESPACE:-${DRONE_NAMESPACE:-drone0}}/sensor_measurements/gps
        navigation_output_topic:=${NAVIGATION_ODOM_TOPIC:-/navigation/odometry}
        initial_lat:=${INITIAL_LAT:-0.0}
        initial_lon:=${INITIAL_LON:-0.0}
        origin_topic:=/navigation/origin
        prior_fix_topic:=${NAVIGATION_TOPIC_PREFIX:-/navigation}/fix
        prior_timeout_s:=2.0
        zoom:=${WILDNAV_ZOOM:-18}
        search_radius_m:=${WILDNAV_SEARCH_RADIUS_M:-250.0}
        search_radius_sigma_scale:=3.0
        max_search_radius_m:=${WILDNAV_MAX_SEARCH_RADIUS_M:-750.0}
        max_tiles:=${WILDNAV_MAX_TILES:-49}
        max_tile_downloads_per_cycle:=${WILDNAV_MAX_DOWNLOADS:-8}
        match_rate_hz:=${WILDNAV_RATE_HZ:-0.2}
        feature_backend:=${WILDNAV_FEATURE_BACKEND:-SIFT}
        min_matches:=${WILDNAV_MIN_MATCHES:-16}
        min_inliers:=${WILDNAV_MIN_INLIERS:-10}
        min_inlier_ratio:=${WILDNAV_MIN_INLIER_RATIO:-0.25}
        max_position_jump_m:=${WILDNAV_MAX_JUMP_M:-250.0}
        camera_mount_yaw_deg:=${CAMERA_MOUNT_YAW_DEG:-0.0}
        minimum_demnav_confidence:=${DEMNAV_FUSION_CONFIDENCE:-0.35}
        minimum_wildnav_confidence:=${WILDNAV_FUSION_CONFIDENCE:-0.20}

  rosbridge:
    # Port 9092, not rosbridge's default 9090: BlueOS's network manager
    # (Cable Guy) listens on 0.0.0.0:9090 on the host network, where
    # rosbridge only logs "Address already in use" every 5 s. The web page
    # (aerostack2 web/app.js) connects to this port. Host IPC and /dev/shm
    # like every ROS container here: on the host network Fast DDS sends to
    # same-host peers through shared memory, and a container with its own
    # /dev/shm discovers the topics but receives none of their messages.
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-arm64}
    container_name: ${ROSBRIDGE_CONTAINER:-rosbridge}
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - /dev/shm:/dev/shm
    command: ros2 launch rosbridge_server rosbridge_websocket_launch.xml port:=9092
