# BlueOS Aerostack2 drone stack.
#
# The navigation core (MAVROS, OAK-1 MegaDepth, DemNav, WildNav,
# rosbridge) lives in blueos_nav_core.yaml, whose defaults render exactly
# this drone deployment; only the Aerostack2 autonomy, behavior tree, GUI
# and telemetry-rate services are drone-specific.

include:
  - blueos_nav_core.yaml
  # Object tracking (systems/aerodrone/tracking.md), opt-in with
  # `--profile tracking`. No env_file: aerodrone_tracking.yaml's fallbacks
  # are this aircraft's values (a nested include's env_file would resolve
  # against the working directory when aerodrone_hardware.yaml includes
  # this file).
  - aerodrone_tracking.yaml

services:
  aerostack:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-arm64}
    container_name: aerostack
    stop_signal: SIGINT  # ros2 launch as PID 1 ignores SIGTERM
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - mavros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - /dev/shm:/dev/shm
    command: >
      ros2 launch as2_platform_blueos blueos_autonomy.launch.py
        namespace:=${DRONE_NAMESPACE:-drone0}
        mavros_namespace:=/mavros
        navigation_odom_topic:=/navigation/odometry
        takeoff_altitude:=${TAKEOFF_ALTITUDE:-2.0}

  aerodrone_message_rates:
    env_file: [../systems/ros2/middleware.env]
    # The readiness gate asks ArduCopter for its telemetry rates once and exits;
    # an autopilot reboot mid-session forgets them. This keeps the same
    # rates (systems/aerodrone/config/message_rates.yaml): at start, after
    # every MAVROS reconnect, and when the attitude stream drops while
    # MAVROS stays connected (systems/aerodrone/README.md, "Telemetry
    # rates"). It sends only message interval commands: no parameter
    # writes, modes or arming.
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-arm64}
    container_name: aerodrone_message_rates
    network_mode: host
    ipc: host
    restart: unless-stopped
    depends_on:
      - mavros
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
      - ../systems/aerodrone/config:/workspace/systems/aerodrone/config:ro
      - /dev/shm:/dev/shm
    command: >
      python3 /workspace/applications/aerostack2/scripts/mavros_message_rates.py
        --namespace /mavros
        --rates /workspace/systems/aerodrone/config/message_rates.yaml

  behavior_tree:
    env_file: [../systems/ros2/middleware.env]
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-arm64}
    container_name: aerostack_behavior_tree
    # run_behavior_tree.py passes SIGINT on to ros2 launch (which ignores
    # SIGTERM) and starts the tree again only when it aborted while being
    # built, before its first tick. The tree ends after each map goal, and
    # restart: always starts it for the next one.
    stop_signal: SIGINT
    network_mode: host
    ipc: host
    restart: always
    depends_on:
      mavros: {condition: service_started}
      aerostack: {condition: service_started}
      demnav: {condition: service_started}
      wildnav: {condition: service_started}
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspace/fastdds.xml
    volumes:
      - ../systems/aerodrone/config/fastdds.xml:/workspace/fastdds.xml:ro
      - ../applications/aerostack2/scripts:/workspace/applications/aerostack2/scripts:ro
    # Wait inside the container so compose up -d returns while the FC is down.
    # The mission still cannot start before odometry and all servers are ready.
    command: >
      python3 /workspace/applications/aerostack2/scripts/wait_for_mavros_navigation.py
        --namespace /mavros --timeout 0 --no-require-gps --settle-seconds 3
        --behavior-tree /workspace/install/share/as2_platform_blueos/resource/map_goal.xml
        --behavior-namespace /${DRONE_NAMESPACE:-drone0}
        --exec python3 /workspace/applications/aerostack2/scripts/run_behavior_tree.py
        --attempts 5 --retry-delay 5 --
        ros2 launch as2_behavior_tree behavior_trees.launch.py
          drone_id:=${DRONE_NAMESPACE:-drone0}
          tree:=/workspace/install/share/as2_platform_blueos/resource/map_goal.xml
          use_sim_time:=false

  aerostack_gui:
    env_file: [../systems/ros2/middleware.env]
    # The map-goal and object-tracking page (applications/aerostack2/README.md,
    # "Map mission" and "Object tracking UI") on port 8080, served from the
    # repository like the scripts above: a new page needs no image rebuild.
    image: salsicha/cyberphysics:aerostack2-${CYBERPHYSICS_TAG:-arm64}
    container_name: aerostack_gui
    network_mode: host
    restart: unless-stopped
    depends_on:
      - rosbridge
    volumes:
      - ../applications/aerostack2/src/as2_platform_blueos/web:/workspace/web:ro
    command: python3 -m http.server 8080 --directory /workspace/web
