# Gazebo layer of the object-tracking simulation test (tools/tracking_sim_test.sh
# adds it after tools/tracking_sim_test.yaml for `gazebo`). The slant mode yaws
# the aircraft; Gazebo's ground-truth twist is the body-frame velocity, which
# the ArduPilot backend sends as ENU by default (GAZEBO_TWIST_IN_BODY_FRAME in
# applications/gazebo/scripts/gazebo_ardupilot_backend.py): ArduPilot's GPS
# velocity then turns with the yaw and its EKF fails (GPS glitch, EKF
# failsafe, emergency yaw reset). Rotate it to ENU.
services:
  gazebo_ardupilot_backend:
    environment:
      GAZEBO_TWIST_IN_BODY_FRAME: "true"
