# Unreal Engine server fragment: a packaged UE Linux build (bring your own;
# applications/unrealengine/README.md) run headless on the GPU, plus rosbridge
# for ROSIntegration projects. Full stack: compositions/unrealengine.yaml.
services:
  ue_server:
    env_file: [../ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:unrealengine-${CYBERPHYSICS_TAG:-latest}
    init: true
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # Launcher settings (applications/unrealengine/server/run_server.sh)
      - UE_PROJECT_SCRIPT
      - UE_MAP
      - UE_RES_X
      - UE_RES_Y
      - UE_PORT
      - UE_GRAPHICS_ADAPTER
      - UE_RENDER_OFFSCREEN
      - UE_NOSOUND
      - UE_EXTRA_ARGS
      - DISPLAY
    volumes:
      - ${UE_BUILD_DIR:-../../applications/unrealengine/server/build}:/server/build
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
    command: /server/run_server.sh
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ue_rosbridge:
    env_file: [../ros2/middleware.env]
    network_mode: host
    pull_policy: if_not_present
    image: salsicha/cyberphysics:unrealengine-${CYBERPHYSICS_TAG:-latest}
    stop_signal: SIGINT
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /dev/shm:/dev/shm
    command: >
      ros2 launch rosbridge_server rosbridge_websocket_launch.xml
        port:=${ROSBRIDGE_PORT:-9090}
        bson_only_mode:=${ROSBRIDGE_BSON_ONLY:-true}
