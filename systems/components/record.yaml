# The /shutdown (power off the host) service is disabled; see
# record-host-shutdown.yaml for the opt-in override.
services:
  record:
    env_file: [../ros2/middleware.env]
    restart: always
    pull_policy: never
    image: salsicha/cyberphysics:record-latest
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /data:/data
      # Directory holding the system env.list; the entrypoint sources it and
      # each recording keeps a copy.
      - ${RECORD_ENV_DIR:?set RECORD_ENV_DIR to the directory containing the system env.list}:/env:ro
    environment:
      - TOPICS_EXCLUDED="-x '(.*)/image_raw_meta$$'"
      - TZ=America/Los_Angeles
      - ROS_LOCALHOST_ONLY=$ROS_LOCALHOST_ONLY
      - ROS_DOMAIN_ID=$ROS_DOMAIN_ID
    command: >
      stdbuf -o L
      python3 record.py --proj_name ${SYSTEM_NAME} --server_w_ip ${SERVER_IP} --server_eth_ip ${ETH_IP:-127.0.0.1}
