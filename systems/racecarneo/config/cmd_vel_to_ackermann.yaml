# Publishes ackermann_msgs in SI units (m/s, rad, positive left), clamped
# to these vehicle limits; consumers convert to their own actuator units.
# Nominal hardware values for a 1/10 Traxxas Slash 4x4-class chassis
# (hardware/racecarneo.md): 0.33 m wheelbase (the Slash 4x4 is 0.324 m) and a
# 24 deg (0.42 rad) steering lock, i.e. a 0.74 m tightest turn. Measure the
# lock on your car (full-lock turning circle) and update both values. The
# simulator stack overrides them with the smaller simulated car's geometry.
racecarneo_cmd_vel_to_ackermann:
  ros__parameters:
    wheelbase: 0.33
    max_speed: 0.35
    max_steering_angle: 0.42
    cmd_vel_topic: cmd_vel
    ackermann_topic: ackermann_cmd
