racecarneo_bridge:
  ros__parameters:
    frame_prefix: racecarneo
    max_speed: 0.35
    publish_camera: true
    publish_depth: true
    publish_lidar: true
    publish_imu: true
    # Unity Camera.fieldOfView is vertical; RacecarSim v2.8 uses 42.5 deg
    # (fx = fy = 617.1 px at 640x480, ~54.8 deg horizontal).
    camera_vertical_fov_degrees: 42.5
    auto_start_user_program: true
    auto_start_duration_sec: 20.0
    publish_odom: true
    publish_tf: true
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    # The RacecarSim v2.8.3 car's wheel colliders sit at +-1.125 Unity units
    # (1 unit = 0.1 m), so its wheelbase is 0.225 m, not the hardware 0.33 m.
    # Odometry integrates yaw rate with it.
    wheelbase: 0.225
    # /ackermann_cmd is SI; these convert it to simulator ratios. RacecarSim
    # v2.8 steers the front wheels angle * 20 deg (0.349 rad) and applies
    # motor torque, not a speed, so max_speed is an open-loop estimate.
    max_steering_angle: 0.349
    sensor_random_seed: 101
    camera_dropout_probability: 0.0
    camera_motion_blur_pixels: 0
    depth_noise_std_m: 0.015
    depth_dropout_probability: 0.01
    lidar_noise_std_m: 0.015
    lidar_dropout_probability: 0.005
    imu_accel_noise_std: 0.08
    imu_gyro_noise_std: 0.015
    imu_accel_bias: [0.02, -0.015, 0.0]
    imu_gyro_bias: [0.001, -0.001, 0.002]
    wheel_slip_std: 0.025
    encoder_quantization_m: 0.002
    throttle_time_constant_s: 0.12
    steering_time_constant_s: 0.09
    battery_nominal_voltage: 11.1
    battery_sag_per_speed: 0.8
    manual_override: false
    estop_engaged: false
    command_timeout_s: 0.5
    publish_actuator_feedback: true
