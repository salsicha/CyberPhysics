name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install numpy opencv-python-headless pytest pyyaml msgpack msgpack-numpy pyzmq
      - name: Install synthetic_world
        run: pip install ./applications/aerostack2/synthetic_world
      - name: Run unit tests
        run: python -m pytest tests/ applications/smolvla/tests/ -v
      - name: Byte-compile navigation sources
        run: >
          python -m compileall -q
          applications/aerostack2/synthetic_world
          applications/aerostack2/mavros_mirror
          applications/demnav/src
          applications/wildnav/src
          systems/airplane
          hardware/parts
          tools
          tests
      - name: Check compose fallbacks match env files
        run: python tools/check_compose_env_defaults.py

  # 3D-printable parts (hardware/parts/README.md): build and validate every
  # part with the pinned CadQuery toolchain (applications/cad), fail if a
  # committed STL or generated doc block is stale, and publish the STLs,
  # STEPs and manifests as the printable-parts artifact.
  printable-parts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: applications/cad/requirements.txt
      - name: Install the CadQuery toolchain
        run: pip install -r applications/cad/requirements.txt
      - name: Part tests
        run: python -m pytest tests/test_printable_parts_build.py tests/test_printable_parts_metadata.py tests/test_printable_parts_docs.py -v
      - name: Committed STLs and generated docs are up to date
        run: python tools/build_printable_parts.py --check
      - name: Build STL, STEP and manifests for download
        if: ${{ !cancelled() }}
        run: python tools/build_printable_parts.py --out printable-parts
      - name: Upload the printable parts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: printable-parts
          path: printable-parts/
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    env:
      # Vendored third-party code is not linted
      VENDORED: applications/whereami/whereami,applications/blackfly/src,applications/vinsmono/vins_mono_ros2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: pip install ruff==0.16.10 shellcheck-py==0.11.0.1
      # Error-class rules only: syntax errors and undefined names. The depthai
      # Script-node example gets `node`/`Buffer` injected by the device runtime.
      - name: Ruff
        run: >
          ruff check --no-cache --output-format github
          --select E9,F63,F7,F82
          --extend-exclude "$VENDORED"
          --config 'lint.per-file-ignores = {"applications/oak1/scripts/references/custom_script.py" = ["F821"]}'
          .
      # install_deps.sh is luxonis' depthai installer, vendored as-is
      - name: ShellCheck
        run: |
          git ls-files -z '*.sh' \
            | grep -zvE "^($(echo "$VENDORED" | tr ',' '|'))/|^applications/oak1/scripts/install_deps\.sh$" \
            | xargs -0 shellcheck --severity=error

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every composition renders
        run: |
          set -e
          for f in compositions/*.yaml; do
            echo "== $f"
            docker compose -f "$f" config --quiet
          done
      - name: Validate systems/components fragments render
        env:
          # record.yaml requires the directory holding a system env.list
          RECORD_ENV_DIR: ${{ github.workspace }}/systems/realsense
        run: |
          set -e
          for f in systems/components/*.yaml; do
            echo "== $f"
            case "$f" in
              # opt-in override, checked on top of the stack that documents it
              systems/components/record-host-shutdown.yaml)
                docker compose -f compositions/blackfly.yaml -f "$f" config --quiet ;;
              *)
                docker compose -f "$f" config --quiet ;;
            esac
          done

  vinsmono-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only the VINS sources' LFS objects (BRIEF vocabulary, masks), not the
      # whole repository's LFS store
      - name: Fetch VINS-Mono LFS objects
        run: |
          git lfs install --local
          git lfs pull --include="applications/vinsmono/**"
      # Pull ros:jazzy-ros-base through mirror.gcr.io (Docker Hub's anonymous
      # pull limit failed this job with 429 Too Many Requests), and retry the
      # build once if it still hits the limit
      - name: Use Google's Docker Hub mirror
        run: .github/workflows/scripts/use_docker_hub_mirror.sh
      - name: Build VINS-Mono
        run: >
          .github/workflows/scripts/retry_on_rate_limit.sh
          docker build -t salsicha/cyberphysics:vinsmono-ci applications/vinsmono
      - name: Check sensor flow and normal shutdown
        run: >
          docker run --rm --network none
          -v "$PWD:/repo:ro"
          salsicha/cyberphysics:vinsmono-ci
          python3 /repo/applications/vinsmono/scripts/runtime_smoke_test.py
          --config /repo/systems/vinsmono/calibration/vins_mono.yaml

  ardupilot-params:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream metadata generator dependency
        run: pip install lxml
      - name: Check .params names against the pinned ArduPilot ref
        run: python3 tools/check_ardupilot_params.py
